<style>
  :root {
    --bg: #efe6d6; --stage: #f3ece0; --card: #fffaf2;
    --ink: #2a2420; --ink2: #4a4038; --muted: #6b5e52;
    --primary: #c8704b; --primary-ink: #a8542e;
    --line: rgba(42,36,32,0.08);
    --font-serif: "Fraunces", Georgia, serif;
    --font-sans: "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 17px/1.6 var(--font-sans);
    background: var(--bg); color: var(--ink);
    min-height: 100dvh; -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 880px; margin: 0 auto; padding: 48px 24px 96px; }
  .nav-back {
    display: inline-flex; align-items: center; gap: 8px;
    font: 500 12px/1 var(--font-mono);
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); text-decoration: none; margin-bottom: 24px;
  }
  .nav-back:hover { color: var(--primary); }
  .eyebrow {
    font: 500 11px/1 var(--font-mono);
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted); display: inline-block; margin-bottom: 14px;
  }
  h1 {
    font: 500 clamp(40px, 7vw, 60px)/1.05 var(--font-serif);
    letter-spacing: -0.02em; margin: 0 0 14px; color: var(--ink);
  }
  h1 em { font-style: italic; color: var(--primary); }
  .lede { color: var(--ink2); font-size: 19px; line-height: 1.55; margin: 0 0 40px; max-width: 56ch; }

  .grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;
  }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }

  .guide-card {
    display: block; background: var(--card); border: 0.5px solid var(--line);
    border-radius: 16px; padding: 26px 26px 22px;
    text-decoration: none; color: var(--ink);
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .guide-card:hover {
    border-color: var(--primary); transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(42,36,32,0.06);
  }
  .guide-eyebrow {
    font: 500 11px/1 var(--font-mono);
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted); display: block; margin-bottom: 12px;
  }
  .guide-title {
    font: 500 22px/1.25 var(--font-serif);
    letter-spacing: -0.01em; margin: 0 0 8px; color: var(--ink);
  }
  .guide-blurb { color: var(--ink2); font-size: 15px; line-height: 1.55; margin: 0 0 16px; }
  .guide-foot {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; padding-top: 14px; border-top: 0.5px solid var(--line);
  }
  .guide-date {
    font: 500 11px/1 var(--font-mono);
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted);
  }
  .guide-cta {
    font: 500 13px/1 var(--font-mono);
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--primary);
  }

  .footer {
    margin-top: 64px; padding-top: 24px;
    border-top: 0.5px solid var(--line);
    font-size: 14px; color: var(--muted);
  }
  .footer a { color: var(--primary); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
</style>

<!-- Vercel Web Analytics -->
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  /* Owner opt-out — see index.html for the full note. ?noanalytics=1 once per
     device; beforeSend returning null drops the event before it is sent. */
  (function () {
    var KEY = "duitful-analytics-off";
    try {
      var q = new URLSearchParams(location.search).get("noanalytics");
      if (q === "1") { localStorage.setItem(KEY, "1"); alert("Duitful: this device is now excluded from analytics."); }
      else if (q === "0") { localStorage.removeItem(KEY); alert("Duitful: this device is counted in analytics again."); }
      if (localStorage.getItem(KEY)) window.va("beforeSend", function () { return null; });
    } catch (e) { /* storage blocked (private mode) — just count normally */ }
  })();
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div class="container">
  <a href="{{ROOT_HREF}}" class="nav-back">{{ROOT_BACK_LABEL}}</a>

  <span class="eyebrow">{{HUB_EYEBROW}}</span>
  <h1>{{HUB_H1}}</h1>
  <p class="lede">{{HUB_LEDE}}</p>

  <div class="grid">
    {{CARDS}}
  </div>

  <div class="footer">
    {{FOOTER_HTML}}
  </div>
</div>
</body>
</html>
