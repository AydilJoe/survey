<!DOCTYPE html>
<html lang="{{LANG}}">

<meta charset="UTF-8">

<meta name="theme-color" content="#e8dfd0">
<meta name="color-scheme" content="light only">

<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="keywords" content="{{KEYWORDS}}">
<meta name="robots" content="index, follow, max-image-preview:large">

<meta property="og:type" content="article">
<meta property="og:site_name" content="Duitful">
<meta property="og:locale" content="{{OG_LOCALE}}">
<meta property="og:url" content="{{CANONICAL_URL}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:image" content="https://duitful.app/og-image.svg">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">

{{JSON_LD}}

<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #efe6d6; --stage: #f3ece0; --card: #fffaf2;
    --ink: #2a2420; --ink2: #4a4038; --muted: #6b5e52;
    --primary: #c8704b; --primary-ink: #a8542e;
    --accent: #8fa078; --accent-ink: #3a6b50;
    --warn: #b86a4e; --warn-ink: #8a3f1c;
    --line: rgba(42,36,32,0.08); --border: rgba(42,36,32,0.14);
    --font-serif: "Fraunces", Georgia, serif;
    --font-sans: "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font: 17px/1.6 var(--font-sans);
    background: var(--bg);
    color: var(--ink);
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }

  .container { max-width: 760px; margin: 0 auto; padding: 40px 24px 96px; }
  .nav-back {
    display: inline-flex; align-items: center; gap: 8px;
    font: 500 12px/1 var(--font-mono);
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); text-decoration: none; margin-bottom: 24px;
  }
  .nav-back:hover { color: var(--primary); }

  .eyebrow {
    font: 500 11px/1 var(--font-mono);
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted); display: inline-block; margin-bottom: 14px;
  }

  h1 {
    font: 500 clamp(36px, 6vw, 52px)/1.05 var(--font-serif);
    letter-spacing: -0.02em; margin: 0 0 14px; color: var(--ink);
  }
  h1 em, h2 em { font-style: italic; color: var(--primary); }

  .dateline {
    font: 500 11px/1.4 var(--font-mono);
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 22px; max-width: none;
  }
  .dateline time { color: inherit; }
  .dateline-sep { margin: 0 4px; opacity: 0.6; }

  .lede { color: var(--ink2); font-size: 19px; line-height: 1.55; margin: 0 0 32px; max-width: 56ch; }

  h2 { font: 500 28px/1.2 var(--font-serif); letter-spacing: -0.01em; margin: 48px 0 14px; color: var(--ink); }
  h3 { font: 500 18px/1.35 var(--font-sans); margin: 24px 0 6px; color: var(--ink); }
  p { margin: 0 0 16px; color: var(--ink2); max-width: 64ch; }
  ul, ol { margin: 0 0 20px; padding-left: 22px; color: var(--ink2); }
  li { margin: 0 0 6px; }
  strong { color: var(--ink); font-weight: 600; }
  a { color: var(--primary); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
  a:hover { color: var(--primary-ink); }
  code { font: 500 14px/1.2 var(--font-mono); background: var(--card); padding: 2px 6px; border-radius: 4px; border: 0.5px solid var(--line); }

  /* ---------- Steps ---------- */
  .steps { list-style: none; padding: 0; display: grid; gap: 12px; margin: 28px 0; }
  .step {
    display: grid; grid-template-columns: 48px 1fr; gap: 16px;
    background: var(--card); border: 0.5px solid var(--line);
    border-radius: 14px; padding: 18px 22px; align-items: start;
  }
  .step-num {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--primary); color: #fffaf2;
    display: grid; place-items: center;
    font: 500 17px/1 var(--font-serif);
  }
  .step h3 { margin: 2px 0 4px; font-size: 17px; }
  .step p { margin: 0; font-size: 15.5px; line-height: 1.5; }

  /* ---------- Stat block ---------- */
  .stat-block {
    background: var(--card); border: 0.5px solid var(--line);
    border-radius: 16px; padding: 36px 28px;
    margin: 32px 0; text-align: center;
  }
  .stat-value {
    font: 500 clamp(44px, 9vw, 72px)/1 var(--font-serif);
    color: var(--primary); letter-spacing: -0.02em;
    margin: 0 0 10px; max-width: none;
  }
  .stat-label { font: 500 16px/1.4 var(--font-sans); color: var(--ink); margin: 0 0 4px; max-width: none; }
  .stat-note { font: 400 13.5px/1.4 var(--font-mono); color: var(--muted); margin: 0; max-width: none; }

  /* ---------- Compare ---------- */
  .compare {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
    margin: 32px 0; border: 0.5px solid var(--line); border-radius: 14px;
    overflow: hidden;
  }
  @media (max-width: 600px) { .compare { grid-template-columns: 1fr; } }
  .compare-col { padding: 22px 24px; }
  .compare-col + .compare-col { border-left: 0.5px solid var(--line); }
  @media (max-width: 600px) {
    .compare-col + .compare-col { border-left: none; border-top: 0.5px solid var(--line); }
  }
  .compare-col.left  { background: rgba(184,106,78,0.05); }
  .compare-col.right { background: rgba(106,138,94,0.06); }
  .compare-title {
    font: 500 11px/1 var(--font-mono); letter-spacing: 0.16em;
    text-transform: uppercase; margin: 0 0 14px;
  }
  .compare-col.left  .compare-title { color: var(--warn-ink); }
  .compare-col.right .compare-title { color: var(--accent-ink); }
  .compare-col ul { padding: 0; list-style: none; margin: 0; }
  .compare-col li {
    padding: 7px 0; font-size: 15px; line-height: 1.45; color: var(--ink2);
    display: flex; gap: 10px; align-items: start;
  }
  .compare-col li::before {
    flex: 0 0 auto; font-weight: 700; line-height: 1.45;
  }
  .compare-col.left  li::before { content: "✕"; color: var(--warn); }
  .compare-col.right li::before { content: "✓"; color: var(--accent-ink); }

  /* ---------- FAQ ---------- */
  .faq { margin: 28px 0; display: grid; gap: 8px; }
  .faq-item {
    background: var(--card); border: 0.5px solid var(--line);
    border-radius: 12px; padding: 4px 22px;
    transition: border-color 0.15s ease;
  }
  .faq-item[open] { border-color: var(--border); }
  .faq-q {
    font: 500 16px/1.4 var(--font-sans); color: var(--ink);
    padding: 14px 0; cursor: pointer; list-style: none;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .faq-q::-webkit-details-marker { display: none; }
  .faq-q::after {
    content: "+"; font: 400 22px/1 var(--font-serif);
    color: var(--muted); transition: transform 0.2s ease;
  }
  .faq-item[open] .faq-q::after { content: "−"; }
  .faq-a { margin: 0 0 16px; font-size: 15.5px; line-height: 1.6; color: var(--ink2); }

  /* ---------- CTA ---------- */
  .cta-card {
    background: var(--card); border: 0.5px solid var(--line);
    border-radius: 18px; padding: 32px 28px;
    margin: 56px 0 0; text-align: center;
  }
  .cta-card h2 { margin: 0 0 8px; font-size: clamp(24px, 4vw, 30px); }
  .cta-card p { margin: 0 auto 18px; max-width: 48ch; }
  .cta-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 26px;
    background: var(--primary); color: #fffaf2;
    border-radius: 999px;
    font: 500 15px/1 var(--font-sans);
    text-decoration: none;
    box-shadow: 0 1px 2px rgba(42,36,32,0.1), 0 8px 20px rgba(200,112,75,0.28);
    transition: background 0.15s ease;
  }
  .cta-btn:hover { background: var(--primary-ink); color: #fffaf2; }

  /* ---------- Footer ---------- */
  .footer {
    margin-top: 64px; padding-top: 24px;
    border-top: 0.5px solid var(--line);
    font-size: 14px; color: var(--muted);
  }
  .footer a { color: var(--primary); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
</style>

<!-- Vercel Web Analytics -->
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div class="container">
  <a href="{{HUB_HREF}}" class="nav-back">{{BACK_LABEL}}</a>

  <span class="eyebrow">{{EYEBROW}}</span>
  <h1>{{H1}}</h1>
  {{DATELINE}}
  <p class="lede">{{LEDE}}</p>

  {{BODY}}

  <div class="cta-card">
    <h2>{{CTA_TITLE}}</h2>
    <p>{{CTA_BODY}}</p>
    <a class="cta-btn" href="/app/">{{CTA_LABEL}} →</a>
  </div>

  <div class="footer">
    {{FOOTER_HTML}}
  </div>
</div>
</body>
</html>
