<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg04" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e3d6bf"/>
    </linearGradient>
    <linearGradient id="ticket04" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98866"/>
      <stop offset="1" stop-color="#b35a39"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg04)"/>

  <!-- Eyebrow -->
  <text x="100" y="160" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="24" letter-spacing="5" fill="#6b5e52" font-weight="500">
    DUITFUL PRO
  </text>

  <!-- Headline -->
  <text x="100" y="290" font-family="'Fraunces', 'Georgia', serif" font-size="92" font-weight="500" fill="#2a2420">No subscription.</text>
  <text x="100" y="395" font-family="'Fraunces', 'Georgia', serif" font-size="92" font-weight="500" fill="#2a2420">Ever.</text>

  <!-- Comparison rows -->
  <g transform="translate(100, 470)" font-family="'Inter', system-ui, sans-serif" font-size="28" fill="#2a2420">
    <!-- Row 1 -->
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="880" height="84" rx="14" fill="#fffaf2" stroke="#e3d6bf" stroke-width="1"/>
      <circle cx="40" cy="42" r="14" fill="#b86a4e"/>
      <text x="40" y="50" text-anchor="middle" fill="#fffaf2" font-size="22" font-weight="700">×</text>
      <text x="80" y="52" font-weight="600">Finance app A</text>
      <text x="860" y="52" text-anchor="end" font-family="'JetBrains Mono', monospace" font-weight="600">RM 25 / month</text>
    </g>
    <!-- Row 2 -->
    <g transform="translate(0,104)">
      <rect x="0" y="0" width="880" height="84" rx="14" fill="#fffaf2" stroke="#e3d6bf" stroke-width="1"/>
      <circle cx="40" cy="42" r="14" fill="#b86a4e"/>
      <text x="40" y="50" text-anchor="middle" fill="#fffaf2" font-size="22" font-weight="700">×</text>
      <text x="80" y="52" font-weight="600">Budget app B</text>
      <text x="860" y="52" text-anchor="end" font-family="'JetBrains Mono', monospace" font-weight="600">RM 18 / month</text>
    </g>
    <!-- Row 3 -->
    <g transform="translate(0,208)">
      <rect x="0" y="0" width="880" height="84" rx="14" fill="#fffaf2" stroke="#e3d6bf" stroke-width="1"/>
      <circle cx="40" cy="42" r="14" fill="#b86a4e"/>
      <text x="40" y="50" text-anchor="middle" fill="#fffaf2" font-size="22" font-weight="700">×</text>
      <text x="80" y="52" font-weight="600">Tracker C</text>
      <text x="860" y="52" text-anchor="end" font-family="'JetBrains Mono', monospace" font-weight="600">RM 12 / month</text>
    </g>
  </g>

  <!-- Hero ticket -->
  <g transform="translate(100, 870)">
    <rect x="0" y="0" width="880" height="280" rx="28" fill="url(#ticket04)"/>
    <!-- Perforation -->
    <line x1="40" y1="260" x2="840" y2="260" stroke="#fffaf2" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="6 8"/>
    <text x="50" y="80" font-family="'JetBrains Mono', monospace" font-size="22" fill="#fffaf2" letter-spacing="4" opacity="0.85">DUITFUL PRO · LIFETIME</text>
    <text x="50" y="200" font-family="'Fraunces', 'Georgia', serif" font-size="120" font-weight="500" fill="#fffaf2">RM 19.90</text>
    <text x="830" y="200" text-anchor="end" font-family="'Fraunces', 'Georgia', serif" font-size="44" font-weight="500" fill="#fffaf2" font-style="italic">once.</text>
  </g>

  <!-- Footer -->
  <text x="100" y="1265" font-family="'Inter', system-ui, sans-serif" font-size="26" fill="#5c524a">
    Web app stays free. Pro pays the Apple/Google dev fees.
  </text>
  <text x="100" y="1310" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="28" fill="#b35a39" font-weight="600" letter-spacing="2">
    duitful.app
  </text>
</svg>
