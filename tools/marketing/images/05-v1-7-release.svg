<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg05" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e3d6bf"/>
    </linearGradient>
    <linearGradient id="mark05" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98866"/>
      <stop offset="1" stop-color="#b35a39"/>
    </linearGradient>
    <radialGradient id="glow05" cx="0.85" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#f6e4ce" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#efe6d6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg05)"/>
  <rect width="1080" height="1350" fill="url(#glow05)"/>

  <!-- Eyebrow -->
  <text x="100" y="180" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="26" letter-spacing="6" fill="#6b5e52" font-weight="500">
    RELEASE · MAY 2026
  </text>

  <!-- Version chip -->
  <g transform="translate(100, 230)">
    <rect x="0" y="0" width="180" height="60" rx="14" fill="url(#mark05)"/>
    <text x="90" y="42" font-family="'Fraunces', 'Georgia', serif" font-size="34" font-weight="600" fill="#fffaf2" text-anchor="middle">v1.7</text>
  </g>

  <!-- Big headline -->
  <text x="100" y="430" font-family="'Fraunces', 'Georgia', serif" font-size="120" font-weight="500" fill="#2a2420">9 things</text>
  <text x="100" y="560" font-family="'Fraunces', 'Georgia', serif" font-size="120" font-weight="500" fill="#2a2420">we shipped</text>
  <text x="100" y="690" font-family="'Fraunces', 'Georgia', serif" font-size="120" font-weight="500" fill="#b35a39" font-style="italic">this week.</text>

  <!-- Bullet list -->
  <g transform="translate(100, 800)" font-family="'Inter', system-ui, sans-serif" font-size="34" fill="#2a2420">
    <text x="0" y="0">🥧 &#160;Spending pie chart on Reports</text>
    <text x="0" y="56">↗ &#160;Quick-pay any debt in 2 taps</text>
    <text x="0" y="112">✏️ &#160;Editable amounts in bulk-pay</text>
    <text x="0" y="168">👀 &#160;Total debt, on the home screen</text>
    <text x="0" y="224">📱 &#160;Mobile layout from scratch</text>
    <text x="0" y="280">🌏 &#160;40+ currencies (was 17)</text>
  </g>

  <!-- Footer -->
  <line x1="100" y1="1210" x2="980" y2="1210" stroke="#2a2420" stroke-opacity="0.14" stroke-width="1"/>
  <text x="100" y="1265" font-family="'Inter', system-ui, sans-serif" font-size="28" fill="#5c524a">
    Free. On-device. No subscription.
  </text>
  <text x="100" y="1310" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="28" fill="#b35a39" font-weight="600" letter-spacing="2">
    duitful.app
  </text>
