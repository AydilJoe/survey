<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e3d6bf"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <text x="100" y="160" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="5" fill="#6b5e52" font-weight="500">WHERE TYPICAL APPS LAND</text>
  <g transform="translate(900, 140)"><rect width="80" height="40" rx="20" fill="#fffaf2" stroke="#e3d6bf"/><text x="40" y="27" font-family="'JetBrains Mono', monospace" font-size="18" fill="#b35a39" text-anchor="middle" font-weight="600" letter-spacing="2">4/5</text></g>

  <text x="100" y="290" font-family="'Fraunces', 'Georgia', serif" font-size="68" font-weight="500" fill="#2a2420">Useful and</text>
  <text x="100" y="370" font-family="'Fraunces', 'Georgia', serif" font-size="68" font-weight="500" fill="#b35a39" font-style="italic">exposed are linked.</text>

  <g transform="translate(80, 470)" font-family="'Inter', sans-serif" fill="#2a2420">
    <g>
      <rect width="920" height="155" rx="22" fill="#fffaf2" stroke="#e3d6bf"/>
      <text x="32" y="50" font-size="22" fill="#8a8178" letter-spacing="3">BANK APPS</text>
      <text x="32" y="92" font-size="24" font-weight="600">Maybank · CIMB · RHB · PB · HLB</text>
      <text x="32" y="128" font-size="20" fill="#5c524a">On-shore by regulation. Bank reads it. Trustworthy floor.</text>
    </g>
    <g transform="translate(0, 175)">
      <rect width="920" height="155" rx="22" fill="#fffaf2" stroke="#e3d6bf"/>
      <text x="32" y="50" font-size="22" fill="#8a8178" letter-spacing="3">E-WALLETS</text>
      <text x="32" y="92" font-size="24" font-weight="600">TNG · GrabPay · Boost · BigPay</text>
      <text x="32" y="128" font-size="20" fill="#5c524a">Wallet ledger on-shore. Analytics SDKs often offshore.</text>
    </g>
    <g transform="translate(0, 350)">
      <rect width="920" height="155" rx="22" fill="#fffaf2" stroke="#e3d6bf"/>
      <text x="32" y="50" font-size="22" fill="#8a8178" letter-spacing="3">BUDGETING / AGGREGATORS</text>
      <text x="32" y="92" font-size="24" font-weight="600">Most offshore-hosted · sometimes ask for bank login</text>
      <text x="32" y="128" font-size="20" fill="#5c524a">Largest data exposure category. Several closures 2024–2025.</text>
    </g>
    <g transform="translate(0, 525)">
      <rect width="920" height="155" rx="22" fill="#fffaf2" stroke="#e3d6bf"/>
      <text x="32" y="50" font-size="22" fill="#8a8178" letter-spacing="3">ACCOUNTING / SME TOOLS</text>
      <text x="32" y="92" font-size="24" font-weight="600">Mixed · Xero/QuickBooks offshore · operator reads books</text>
      <text x="32" y="128" font-size="20" fill="#5c524a">Fine for IRB-visible records. Less fine for personal money.</text>
    </g>
  </g>

  <text x="100" y="1300" font-family="'JetBrains Mono', monospace" font-size="22" fill="#b35a39" font-weight="600" letter-spacing="2">duitful.app</text>
</svg>
