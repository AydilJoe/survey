<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e3d6bf"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <text x="100" y="160" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="5" fill="#6b5e52" font-weight="500">THE EV-BUYING TRAP</text>
  <g transform="translate(900, 140)"><rect width="80" height="40" rx="20" fill="#fffaf2" stroke="#e3d6bf"/><text x="40" y="27" font-family="'JetBrains Mono', monospace" font-size="18" fill="#b35a39" text-anchor="middle" font-weight="600" letter-spacing="2">4/5</text></g>

  <text x="100" y="290" font-family="'Fraunces', 'Georgia', serif" font-size="68" font-weight="500" fill="#2a2420">Don't buy an EV</text>
  <text x="100" y="370" font-family="'Fraunces', 'Georgia', serif" font-size="68" font-weight="500" fill="#b35a39" font-style="italic">just for the savings.</text>

  <g transform="translate(80, 470)" font-family="'Inter', sans-serif" fill="#2a2420">
    <rect width="920" height="640" rx="22" fill="#fffaf2" stroke="#e3d6bf"/>

    <text x="40" y="60" font-family="'JetBrains Mono', monospace" font-size="18" fill="#8a8178" letter-spacing="3">THE MATH NOBODY SHOWS YOU</text>

    <g transform="translate(40, 100)">
      <text font-size="22" font-weight="600">Entry EV (2026)</text>
      <text y="34" font-family="'Fraunces', serif" font-size="40" fill="#2a2420">RM 110k–150k</text>
      <text y="68" font-size="18" fill="#5c524a">on the road, basic spec</text>
    </g>

    <g transform="translate(500, 100)">
      <text font-size="22" font-weight="600">Equivalent petrol sedan</text>
      <text y="34" font-family="'Fraunces', serif" font-size="40" fill="#2a2420">RM 80k–100k</text>
      <text y="68" font-size="18" fill="#5c524a">comparable spec, 1.5L</text>
    </g>

    <line x1="40" y1="240" x2="880" y2="240" stroke="#e3d6bf" stroke-width="1"/>

    <g transform="translate(40, 280)">
      <text font-size="22" font-weight="600">Price gap</text>
      <text y="34" font-family="'Fraunces', serif" font-size="40" fill="#b35a39">RM 25k–40k</text>
      <text y="68" font-size="18" fill="#5c524a">↓</text>
    </g>

    <g transform="translate(500, 280)">
      <text font-size="22" font-weight="600">Monthly fuel saving</text>
      <text y="34" font-family="'Fraunces', serif" font-size="40" fill="#5c8a6e">RM 250</text>
      <text y="68" font-size="18" fill="#5c524a">↓</text>
    </g>

    <line x1="40" y1="400" x2="880" y2="400" stroke="#e3d6bf" stroke-width="1"/>

    <g transform="translate(40, 460)">
      <text font-family="'JetBrains Mono', monospace" font-size="18" fill="#8a8178" letter-spacing="3">PAYBACK ON FUEL ALONE</text>
      <text y="60" font-family="'Fraunces', serif" font-size="64" font-style="italic" fill="#b86a4e" font-weight="500">8–14 years</text>
      <text y="120" font-size="22" fill="#5c524a">Buy when due to replace your car —</text>
      <text y="148" font-size="22" fill="#5c524a" font-weight="600">let savings shorten the payback, not justify it.</text>
    </g>
  </g>

  <text x="100" y="1300" font-family="'JetBrains Mono', monospace" font-size="22" fill="#5c8a6e" font-weight="600" letter-spacing="2">duitful.app</text>
</svg>
