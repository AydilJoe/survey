<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e3d6bf"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98866"/>
      <stop offset="1" stop-color="#b35a39"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <text x="100" y="160" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="5" fill="#6b5e52" font-weight="500">WHO THIS MOVES</text>
  <g transform="translate(900, 140)"><rect width="80" height="40" rx="20" fill="#fffaf2" stroke="#e3d6bf"/><text x="40" y="27" font-family="'JetBrains Mono', monospace" font-size="18" fill="#b35a39" text-anchor="middle" font-weight="600" letter-spacing="2">3/5</text></g>

  <text x="100" y="290" font-family="'Fraunces', 'Georgia', serif" font-size="68" font-weight="500" fill="#2a2420">Five fintech</text>
  <text x="100" y="370" font-family="'Fraunces', 'Georgia', serif" font-size="68" font-weight="500" fill="#b35a39" font-style="italic">categories. Five answers.</text>

  <g transform="translate(80, 460)" font-family="'Inter', sans-serif" fill="#2a2420">
    <g>
      <rect width="920" height="120" rx="18" fill="#fffaf2" stroke="#e3d6bf"/>
      <circle cx="60" cy="60" r="32" fill="#fbecd9" stroke="url(#primary)" stroke-width="2"/>
      <text x="60" y="72" text-anchor="middle" font-family="'Fraunces', serif" font-size="28" fill="#b35a39" font-weight="500">1</text>
      <text x="120" y="55" font-size="22" font-weight="600">Credit / fraud / KYC model owners</text>
      <text x="120" y="86" font-size="18" fill="#5c524a">Primary buyers · 4–8 months to first cutover.</text>
    </g>
    <g transform="translate(0, 140)">
      <rect width="920" height="120" rx="18" fill="#fffaf2" stroke="#e3d6bf"/>
      <circle cx="60" cy="60" r="32" fill="#fbecd9" stroke="url(#primary)" stroke-width="2"/>
      <text x="60" y="72" text-anchor="middle" font-family="'Fraunces', serif" font-size="28" fill="#b35a39" font-weight="500">2</text>
      <text x="120" y="55" font-size="22" font-weight="600">Banks &amp; insurers with embedded GenAI</text>
      <text x="120" y="86" font-size="18" fill="#5c524a">Open-weights on-shore = parity + residency.</text>
    </g>
    <g transform="translate(0, 280)">
      <rect width="920" height="120" rx="18" fill="#fffaf2" stroke="#e3d6bf"/>
      <circle cx="60" cy="60" r="32" fill="#fbecd9" stroke="url(#primary)" stroke-width="2"/>
      <text x="60" y="72" text-anchor="middle" font-family="'Fraunces', serif" font-size="28" fill="#b35a39" font-weight="500">3</text>
      <text x="120" y="55" font-size="22" font-weight="600">Aggregator / budgeting apps</text>
      <text x="120" y="86" font-size="18" fill="#5c524a">Care most. Move slowest. Feature velocity wins.</text>
    </g>
    <g transform="translate(0, 420)">
      <rect width="920" height="120" rx="18" fill="#fffaf2" stroke="#e3d6bf"/>
      <circle cx="60" cy="60" r="32" fill="#e6efdb" stroke="#8fa078" stroke-width="2"/>
      <text x="60" y="72" text-anchor="middle" font-family="'Fraunces', serif" font-size="28" fill="#5c8a6e" font-weight="500">4</text>
      <text x="120" y="55" font-size="22" font-weight="600">On-device apps (Duitful &amp; co)</text>
      <text x="120" y="86" font-size="18" fill="#5c524a">Already compliant. Data never leaves the phone.</text>
    </g>
    <g transform="translate(0, 560)">
      <rect width="920" height="120" rx="18" fill="#fffaf2" stroke="#e3d6bf"/>
      <circle cx="60" cy="60" r="32" fill="#fbecd9" stroke="url(#primary)" stroke-width="2"/>
      <text x="60" y="72" text-anchor="middle" font-family="'Fraunces', serif" font-size="28" fill="#b35a39" font-weight="500">5</text>
      <text x="120" y="55" font-size="22" font-weight="600">SME / corporate-banking software</text>
      <text x="120" y="86" font-size="18" fill="#5c524a">H2 RFPs: "Malaysian-resident inference" — line item.</text>
    </g>
  </g>

  <text x="100" y="1300" font-family="'JetBrains Mono', monospace" font-size="22" fill="#b35a39" font-weight="600" letter-spacing="2">duitful.app</text>
