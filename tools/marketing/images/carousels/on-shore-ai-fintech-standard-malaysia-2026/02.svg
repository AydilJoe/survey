        <text y="234" font-weight="600">Regulator posture</text>
        <text y="262" fill="#5c524a">Preferred · matches the spirit</text>
        <text y="320" font-style="italic" fill="#8a8178" font-size="17">Simpler answer. Survives stress reviews.</text>
