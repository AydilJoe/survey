<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e3d6bf"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <text x="100" y="160" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="5" fill="#6b5e52" font-weight="500">WHERE THE YIELD IS</text>
  <g transform="translate(900, 140)"><rect width="80" height="40" rx="20" fill="#fffaf2" stroke="#e3d6bf"/><text x="40" y="27" font-family="'JetBrains Mono', monospace" font-size="18" fill="#b35a39" text-anchor="middle" font-weight="600" letter-spacing="2">3/5</text></g>

  <text x="100" y="290" font-family="'Fraunces', 'Georgia', serif" font-size="68" font-weight="500" fill="#2a2420">3–4.5% <tspan font-style="italic" fill="#b35a39">is on the menu.</tspan></text>
  <text x="100" y="370" font-family="'Fraunces', 'Georgia', serif" font-size="44" font-weight="500" fill="#5c524a">You just have to ask.</text>

  <!-- Two columns -->
  <g transform="translate(60, 470)" font-family="'Inter', sans-serif">
    <g>
      <rect width="465" height="660" rx="22" fill="#fffaf2" stroke="#e3d6bf"/>
      <rect width="465" height="80" rx="22" fill="#8fa078"/>
      <rect y="60" width="465" height="20" fill="#8fa078"/>
      <text x="232" y="50" text-anchor="middle" font-family="'Fraunces', serif" font-size="32" fill="#fffaf2" font-weight="500">Liquid · no lock</text>
      <g transform="translate(28, 130)" font-size="20" fill="#2a2420">
        <text font-weight="600">Digital banks</text>
        <text y="28" fill="#5c524a">GX, AEON, Boost · 3.0–4.0%</text>
        <text y="78" font-weight="600">Money market funds</text>
        <text y="106" fill="#5c524a">Versa, KDI, Wahed · 3.2–3.7%</text>
        <text y="156" font-weight="600">Tier-up savings</text>
        <text y="184" fill="#5c524a">Maybank/CIMB · 2.0–3.0%</text>
        <text y="234" font-weight="600">Tabung Haji</text>
        <text y="262" fill="#5c524a">~3.0% historical hibah</text>
        <text y="320" font-style="italic" fill="#8a8178" font-size="17">Read the tier ceiling carefully.</text>
      </g>
    </g>
    <g transform="translate(495, 0)">
      <rect width="465" height="660" rx="22" fill="#fffaf2" stroke="#e3d6bf"/>
      <rect width="465" height="80" rx="22" fill="#b35a39"/>
      <rect y="60" width="465" height="20" fill="#b35a39"/>
      <text x="232" y="50" text-anchor="middle" font-family="'Fraunces', serif" font-size="32" fill="#fffaf2" font-weight="500">Locked · FD</text>
      <g transform="translate(28, 130)" font-size="20" fill="#2a2420">
        <text font-weight="600">FD 1-month</text>
        <text y="28" fill="#5c524a">2.7–2.9% · barely beats MMF</text>
        <text y="78" font-weight="600">FD 6-month</text>
        <text y="106" fill="#5c524a">3.0–3.4% · the sweet spot</text>
        <text y="156" font-weight="600">FD 12-month promo</text>
        <text y="184" fill="#5c524a">3.4–3.8% · only if rates fall</text>
        <text y="234" font-weight="600">ASB / ASM</text>
        <text y="262" fill="#5c524a">variable · not apples-to-apples</text>
        <text y="320" font-style="italic" fill="#8a8178" font-size="17">Don't lock before Thursday's MPC.</text>
      </g>
    </g>
  </g>

  <text x="100" y="1300" font-family="'JetBrains Mono', monospace" font-size="22" fill="#b35a39" font-weight="600" letter-spacing="2">duitful.app</text>
</svg>
