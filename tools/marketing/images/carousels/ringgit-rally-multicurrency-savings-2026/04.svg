<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e3d6bf"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98866"/>
      <stop offset="1" stop-color="#b35a39"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <text x="100" y="160" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="5" fill="#6b5e52" font-weight="500">THIS WEEK · THREE STEPS</text>
  <g transform="translate(900, 140)"><rect width="80" height="40" rx="20" fill="#fffaf2" stroke="#e3d6bf"/><text x="40" y="27" font-family="'JetBrains Mono', monospace" font-size="18" fill="#b35a39" text-anchor="middle" font-weight="600" letter-spacing="2">4/5</text></g>

  <text x="100" y="290" font-family="'Fraunces', 'Georgia', serif" font-size="68" font-weight="500" fill="#2a2420">A reasonable</text>
  <text x="100" y="370" font-family="'Fraunces', 'Georgia', serif" font-size="68" font-weight="500" fill="#2a2420">Malaysian default <tspan font-style="italic" fill="#b35a39">mix</tspan>:</text>

  <!-- Pie-style mix -->
  <g transform="translate(540, 700)">
    <!-- 70 / 20 / 10 visual using bars -->
    <g transform="translate(-440, -90)">
      <rect width="640" height="80" rx="14" fill="url(#primary)"/>
      <rect x="640" y="0" width="180" height="80" rx="0" fill="#8fa078"/>
      <rect x="820" y="0" width="60" height="80" rx="0" fill="#d4a574"/>
      <rect width="880" height="80" rx="14" fill="none" stroke="#e3d6bf" stroke-width="0.5"/>
      <text x="320" y="50" text-anchor="middle" font-family="'Fraunces', serif" font-size="38" fill="#fffaf2" font-weight="500">70%</text>
      <text x="730" y="50" text-anchor="middle" font-family="'Fraunces', serif" font-size="32" fill="#fffaf2" font-weight="500">20%</text>
      <text x="850" y="48" text-anchor="middle" font-family="'Fraunces', serif" font-size="22" fill="#fffaf2" font-weight="500">10%</text>
    </g>
    <g transform="translate(-440, 20)" font-family="'Inter', sans-serif">
      <text x="320" y="0" text-anchor="middle" font-size="22" fill="#2a2420" font-weight="600">MYR</text>
      <text x="730" y="0" text-anchor="middle" font-size="22" fill="#2a2420" font-weight="600">USD</text>
      <text x="850" y="0" text-anchor="middle" font-size="20" fill="#2a2420" font-weight="600">other</text>
    </g>
  </g>

  <!-- Steps below -->
  <g transform="translate(80, 850)" font-family="'Inter', sans-serif" fill="#2a2420">
    <g>
      <text font-size="22" font-weight="600"><tspan fill="#b35a39">1.</tspan> Pull your real currency split today.</text>
      <text y="40" font-size="22" font-weight="600"><tspan fill="#b35a39">2.</tspan> Compare to target. Decide direction.</text>
      <text y="80" font-size="22" font-weight="600"><tspan fill="#b35a39">3.</tspan> Schedule transfers in tranches.</text>
    </g>
  </g>

  <g transform="translate(80, 1080)">
    <rect width="920" height="120" rx="20" fill="#fffaf2" stroke="#e3d6bf"/>
    <text x="460" y="50" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="20" fill="#8a8178" letter-spacing="3">TAG IN DUITFUL</text>
    <text x="460" y="90" text-anchor="middle" font-family="'Fraunces', serif" font-size="30" fill="#2a2420" font-weight="500">FX · Rebalance · 2026-05</text>
  </g>

  <text x="100" y="1300" font-family="'JetBrains Mono', monospace" font-size="22" fill="#b35a39" font-weight="600" letter-spacing="2">duitful.app</text>
</svg>
