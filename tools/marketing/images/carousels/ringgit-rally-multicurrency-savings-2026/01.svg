<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e3d6bf"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98866"/>
      <stop offset="1" stop-color="#b35a39"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <text x="100" y="160" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="5" fill="#6b5e52" font-weight="500">RINGGIT · MAY 4, 2026</text>
  <g transform="translate(900, 140)"><rect width="80" height="40" rx="20" fill="#fffaf2" stroke="#e3d6bf"/><text x="40" y="27" font-family="'JetBrains Mono', monospace" font-size="18" fill="#b35a39" text-anchor="middle" font-weight="600" letter-spacing="2">1/5</text></g>

  <text x="100" y="320" font-family="'Fraunces', 'Georgia', serif" font-size="80" font-weight="500" fill="#2a2420">Ringgit just</text>
  <text x="100" y="410" font-family="'Fraunces', 'Georgia', serif" font-size="80" font-weight="500" fill="#b35a39" font-style="italic">opened</text>
  <text x="100" y="500" font-family="'Fraunces', 'Georgia', serif" font-size="80" font-weight="500" fill="#2a2420">at this.</text>

  <!-- Big rate display -->
  <g transform="translate(80, 600)">
    <rect width="920" height="320" rx="28" fill="url(#primary)"/>
    <text x="460" y="80" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="22" fill="#fffaf2" letter-spacing="4" opacity="0.85">USD / MYR · OPEN</text>
    <text x="460" y="240" text-anchor="middle" font-family="'Fraunces', 'Georgia', serif" font-size="180" font-weight="500" fill="#fffaf2">RM 3.95</text>
    <text x="460" y="290" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" fill="#fffaf2" opacity="0.8">multi-month high · safe-haven repricing</text>
  </g>

  <text x="540" y="1000" text-anchor="middle" font-family="'Inter', sans-serif" font-size="28" fill="#5c524a" font-weight="500">MPC sits Thursday, May 7.</text>
  <text x="540" y="1042" text-anchor="middle" font-family="'Inter', sans-serif" font-size="28" fill="#5c524a" font-weight="500">Cleanest rebalance window in months.</text>

  <text x="540" y="1180" text-anchor="middle" font-family="'Fraunces', serif" font-size="44" font-weight="500" fill="#2a2420">Four <tspan font-style="italic" fill="#b35a39">boring rules</tspan>.</text>

  <text x="100" y="1300" font-family="'JetBrains Mono', monospace" font-size="22" fill="#b35a39" font-weight="600" letter-spacing="2">duitful.app  ·  Swipe →</text>
</svg>
