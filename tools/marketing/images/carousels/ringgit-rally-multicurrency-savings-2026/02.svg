<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e3d6bf"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98866"/>
      <stop offset="1" stop-color="#b35a39"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <text x="100" y="160" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="5" fill="#6b5e52" font-weight="500">FOUR BORING RULES</text>
  <g transform="translate(900, 140)"><rect width="80" height="40" rx="20" fill="#fffaf2" stroke="#e3d6bf"/><text x="40" y="27" font-family="'JetBrains Mono', monospace" font-size="18" fill="#b35a39" text-anchor="middle" font-weight="600" letter-spacing="2">2/5</text></g>

  <text x="100" y="290" font-family="'Fraunces', 'Georgia', serif" font-size="68" font-weight="500" fill="#2a2420">Boring beats</text>
  <text x="100" y="370" font-family="'Fraunces', 'Georgia', serif" font-size="68" font-weight="500" fill="#b35a39" font-style="italic">forecasting.</text>

  <!-- 4 rule cards -->
  <g transform="translate(80, 460)" font-family="'Inter', sans-serif" fill="#2a2420">
    <g>
      <rect width="920" height="160" rx="20" fill="#fffaf2" stroke="#e3d6bf"/>
      <circle cx="60" cy="80" r="32" fill="#fffaf2" stroke="url(#primary)" stroke-width="3"/>
      <text x="60" y="92" text-anchor="middle" font-family="'Fraunces', serif" font-size="32" fill="#b35a39" font-weight="500">1</text>
      <text x="120" y="68" font-size="28" font-weight="600">Rebalance to a target mix.</text>
      <text x="120" y="108" font-size="20" fill="#5c524a">Not to a forecast. Trigger at &gt;5% drift.</text>
    </g>
    <g transform="translate(0, 180)">
      <rect width="920" height="160" rx="20" fill="#fffaf2" stroke="#e3d6bf"/>
      <circle cx="60" cy="80" r="32" fill="#fffaf2" stroke="url(#primary)" stroke-width="3"/>
      <text x="60" y="92" text-anchor="middle" font-family="'Fraunces', serif" font-size="32" fill="#b35a39" font-weight="500">2</text>
      <text x="120" y="68" font-size="28" font-weight="600">Move in tranches.</text>
      <text x="120" y="108" font-size="20" fill="#5c524a">Three transfers, two weeks. Insurance against being wrong.</text>
    </g>
    <g transform="translate(0, 360)">
      <rect width="920" height="160" rx="20" fill="#fffaf2" stroke="#e3d6bf"/>
      <circle cx="60" cy="80" r="32" fill="#fffaf2" stroke="url(#primary)" stroke-width="3"/>
      <text x="60" y="92" text-anchor="middle" font-family="'Fraunces', serif" font-size="32" fill="#b35a39" font-weight="500">3</text>
      <text x="120" y="68" font-size="28" font-weight="600">Licensed channels only.</text>
      <text x="120" y="108" font-size="20" fill="#5c524a">DuitNow, Wise, MCAs. Never Telegram brokers.</text>
    </g>
    <g transform="translate(0, 540)">
      <rect width="920" height="160" rx="20" fill="#fffaf2" stroke="#e3d6bf"/>
      <circle cx="60" cy="80" r="32" fill="#fffaf2" stroke="url(#primary)" stroke-width="3"/>
      <text x="60" y="92" text-anchor="middle" font-family="'Fraunces', serif" font-size="32" fill="#b35a39" font-weight="500">4</text>
      <text x="120" y="68" font-size="28" font-weight="600">Log the rate, not just the amount.</text>
      <text x="120" y="108" font-size="20" fill="#5c524a">All-in including spread. Reveals real provider cost.</text>
    </g>
  </g>

  <text x="100" y="1300" font-family="'JetBrains Mono', monospace" font-size="22" fill="#b35a39" font-weight="600" letter-spacing="2">duitful.app</text>
</svg>
