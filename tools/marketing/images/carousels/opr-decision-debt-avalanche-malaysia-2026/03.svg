<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e3d6bf"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <text x="100" y="160" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="5" fill="#6b5e52" font-weight="500">FLOATING vs FIXED</text>
  <g transform="translate(900, 140)"><rect width="80" height="40" rx="20" fill="#fffaf2" stroke="#e3d6bf"/><text x="40" y="27" font-family="'JetBrains Mono', monospace" font-size="18" fill="#b35a39" text-anchor="middle" font-weight="600" letter-spacing="2">3/5</text></g>

  <text x="100" y="290" font-family="'Fraunces', 'Georgia', serif" font-size="68" font-weight="500" fill="#2a2420">Half your debt</text>
  <text x="100" y="370" font-family="'Fraunces', 'Georgia', serif" font-size="68" font-weight="500" fill="#b35a39" font-style="italic">doesn't move at all.</text>

  <g transform="translate(60, 470)" font-family="'Inter', sans-serif">
    <g>
      <rect width="465" height="660" rx="22" fill="#fffaf2" stroke="#e3d6bf"/>
      <rect width="465" height="80" rx="22" fill="#b35a39"/>
      <rect y="60" width="465" height="20" fill="#b35a39"/>
      <text x="232" y="50" text-anchor="middle" font-family="'Fraunces', serif" font-size="32" fill="#fffaf2" font-weight="500">Floating · reprices</text>
      <g transform="translate(28, 130)" font-size="20" fill="#2a2420">
        <text font-weight="600">Mortgages</text>
        <text y="28" fill="#5c524a">BLR/SBR + spread · 1–3 mo lag</text>
        <text y="78" font-weight="600">BLR-linked credit lines</text>
        <text y="106" fill="#5c524a">Less common · check facility letter</text>
        <text y="156" font-weight="600">Some refinanced packages</text>
        <text y="184" fill="#5c524a">Read the variable-rate clause</text>
        <text y="240" font-style="italic" fill="#8a8178" font-size="17">25 bps on RM 500k = ~RM 75/month.</text>
      </g>
    </g>
    <g transform="translate(495, 0)">
      <rect width="465" height="660" rx="22" fill="#fffaf2" stroke="#e3d6bf"/>
      <rect width="465" height="80" rx="22" fill="#8fa078"/>
      <rect y="60" width="465" height="20" fill="#8fa078"/>
      <text x="232" y="50" text-anchor="middle" font-family="'Fraunces', serif" font-size="32" fill="#fffaf2" font-weight="500">Fixed · stays put</text>
      <g transform="translate(28, 130)" font-size="20" fill="#2a2420">
        <text font-weight="600">Credit cards</text>
        <text y="28" fill="#5c524a">18% cap (BNM) · always top of stack</text>
        <text y="78" font-weight="600">Personal loans</text>
        <text y="106" fill="#5c524a">Flat-rate / fixed reducing balance</text>
        <text y="156" font-weight="600">Hire-purchase (cars)</text>
        <text y="184" fill="#5c524a">Rule of 78 · locked at signing</text>
        <text y="234" font-weight="600">BNPL</text>
        <text y="262" fill="#5c524a">Headline 0% · OPR doesn't touch it</text>
        <text y="320" font-style="italic" fill="#8a8178" font-size="17">Tag floating vs fixed. Re-rank on rate moves.</text>
      </g>
    </g>
  </g>

  <text x="100" y="1300" font-family="'JetBrains Mono', monospace" font-size="22" fill="#b35a39" font-weight="600" letter-spacing="2">duitful.app</text>
</svg>
