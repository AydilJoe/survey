  <rect width="1080" height="1350" fill="url(#bg)"/>

  <text x="100" y="160" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="5" fill="#6b5e52" font-weight="500">BNM · MPC · MAY 7, 2026</text>
  <g transform="translate(900, 140)"><rect width="80" height="40" rx="20" fill="#fffaf2" stroke="#e3d6bf"/><text x="40" y="27" font-family="'JetBrains Mono', monospace" font-size="18" fill="#b35a39" text-anchor="middle" font-weight="600" letter-spacing="2">1/5</text></g>

  <text x="100" y="320" font-family="'Fraunces', 'Georgia', serif" font-size="76" font-weight="500" fill="#2a2420">MPC sits Thursday.</text>
  <text x="100" y="410" font-family="'Fraunces', 'Georgia', serif" font-size="76" font-weight="500" fill="#b35a39" font-style="italic">Your debt is listening.</text>

  <g transform="translate(540, 760)">
    <text x="0" y="0" text-anchor="middle" font-family="'Fraunces', 'Georgia', serif" font-size="200" font-weight="500" fill="#b35a39" font-style="italic">2.75%</text>
    <text x="0" y="70" text-anchor="middle" font-family="'Fraunces', serif" font-size="42" font-weight="500" fill="#2a2420">held · for now</text>
