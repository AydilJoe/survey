  <text x="540" y="1190" text-anchor="middle" font-family="'Inter', sans-serif" font-size="24" fill="#5c524a">Most articles cover the deposit side this week.</text>
  <text x="540" y="1222" text-anchor="middle" font-family="'Inter', sans-serif" font-size="24" fill="#5c524a">The debt side is where the math actually moves.</text>

  <text x="100" y="1300" font-family="'JetBrains Mono', monospace" font-size="22" fill="#b35a39" font-weight="600" letter-spacing="2">duitful.app  ·  Swipe →</text>
