<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e3d6bf"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98866"/>
      <stop offset="1" stop-color="#b35a39"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <text x="100" y="160" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="5" fill="#6b5e52" font-weight="500">WHAT IT IS</text>
  <g transform="translate(900, 140)">
    <rect width="80" height="40" rx="20" fill="#fffaf2" stroke="#e3d6bf"/>
    <text x="40" y="27" font-family="'JetBrains Mono', monospace" font-size="18" fill="#b35a39" text-anchor="middle" font-weight="600" letter-spacing="2">2/5</text>
  </g>

  <text x="100" y="290" font-family="'Fraunces', 'Georgia', serif" font-size="68" font-weight="500" fill="#2a2420">Tokenised deposit:</text>
  <text x="100" y="380" font-family="'Fraunces', 'Georgia', serif" font-size="44" font-weight="500" fill="#5c524a">your <tspan fill="#b35a39" font-style="italic">RM in a bank account</tspan>,</text>
  <text x="100" y="430" font-family="'Fraunces', 'Georgia', serif" font-size="44" font-weight="500" fill="#5c524a">represented as a token on a</text>
  <text x="100" y="480" font-family="'Fraunces', 'Georgia', serif" font-size="44" font-weight="500" fill="#5c524a">permissioned ledger.</text>

  <!-- Three differentiators -->
  <g transform="translate(80, 580)" font-family="'Inter', sans-serif" fill="#2a2420">
    <g transform="translate(0,0)">
      <rect width="920" height="180" rx="20" fill="#fffaf2" stroke="#e3d6bf"/>
      <text x="40" y="60" font-family="'JetBrains Mono', monospace" font-size="18" fill="#8a8178" letter-spacing="3">ISSUER</text>
      <text x="40" y="120" font-size="32" font-weight="600">Licensed banks · BNM oversight</text>
      <text x="40" y="155" font-size="20" fill="#5c524a">Same Maybank, CIMB, Public Bank you already use.</text>
    </g>
    <g transform="translate(0, 200)">
      <rect width="920" height="180" rx="20" fill="#fffaf2" stroke="#e3d6bf"/>
      <text x="40" y="60" font-family="'JetBrains Mono', monospace" font-size="18" fill="#8a8178" letter-spacing="3">BACKING</text>
      <text x="40" y="120" font-size="32" font-weight="600">1:1 against your real deposit</text>
      <text x="40" y="155" font-size="20" fill="#5c524a">PIDM coverage applies the same way.</text>
    </g>
    <g transform="translate(0, 400)">
      <rect width="920" height="180" rx="20" fill="#fffaf2" stroke="#e3d6bf"/>
      <text x="40" y="60" font-family="'JetBrains Mono', monospace" font-size="18" fill="#8a8178" letter-spacing="3">RAILS</text>
      <text x="40" y="120" font-size="32" font-weight="600">Permissioned chains, not Ethereum</text>
      <text x="40" y="155" font-size="20" fill="#5c524a">Run by banks &amp; the central bank, not strangers.</text>
    </g>
  </g>

  <text x="100" y="1300" font-family="'JetBrains Mono', monospace" font-size="22" fill="#b35a39" font-weight="600" letter-spacing="2">duitful.app</text>
</svg>
