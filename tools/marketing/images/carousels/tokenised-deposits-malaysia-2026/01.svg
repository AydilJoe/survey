<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e3d6bf"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98866"/>
      <stop offset="1" stop-color="#b35a39"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <text x="100" y="160" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="5" fill="#6b5e52" font-weight="500">BNM · DAIH · MAY 2026</text>
  <g transform="translate(900, 140)">
    <rect width="80" height="40" rx="20" fill="#fffaf2" stroke="#e3d6bf"/>
    <text x="40" y="27" font-family="'JetBrains Mono', monospace" font-size="18" fill="#b35a39" text-anchor="middle" font-weight="600" letter-spacing="2">1/5</text>
  </g>

  <!-- Headline -->
  <text x="100" y="320" font-family="'Fraunces', 'Georgia', serif" font-size="80" font-weight="500" fill="#2a2420">BNM just turned</text>
  <text x="100" y="410" font-family="'Fraunces', 'Georgia', serif" font-size="80" font-weight="500" fill="#b35a39" font-style="italic">blockchain</text>
  <text x="100" y="500" font-family="'Fraunces', 'Georgia', serif" font-size="80" font-weight="500" fill="#2a2420">into <tspan font-style="italic">boring</tspan>.</text>

  <text x="100" y="600" font-family="'Fraunces', 'Georgia', serif" font-size="44" font-weight="500" fill="#5c524a">(That's a good thing.)</text>

  <!-- Visual -->
  <g transform="translate(540, 870)">
    <!-- Outer ring representing ledger -->
    <circle r="180" fill="none" stroke="#b35a39" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 8"/>
    <!-- Bank node -->
    <g transform="translate(-50, -50)">
      <rect width="100" height="100" rx="20" fill="url(#primary)"/>
      <text x="50" y="60" text-anchor="middle" font-family="'Fraunces', serif" font-size="48" fill="#fffaf2" font-weight="500">RM</text>
    </g>
    <!-- Connected nodes -->
    <g>
      <line x1="0" y1="-180" x2="0" y2="-50" stroke="#b35a39" stroke-opacity="0.4" stroke-width="2"/>
      <circle cx="0" cy="-180" r="22" fill="#fffaf2" stroke="#b35a39" stroke-width="2"/>
      <text x="0" y="-173" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#b35a39" font-weight="600">BNK</text>
      <line x1="156" y1="90" x2="40" y2="35" stroke="#b35a39" stroke-opacity="0.4" stroke-width="2"/>
      <circle cx="156" cy="90" r="22" fill="#fffaf2" stroke="#b35a39" stroke-width="2"/>
      <text x="156" y="97" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#b35a39" font-weight="600">BNK</text>
      <line x1="-156" y1="90" x2="-40" y2="35" stroke="#b35a39" stroke-opacity="0.4" stroke-width="2"/>
      <circle cx="-156" cy="90" r="22" fill="#fffaf2" stroke="#b35a39" stroke-width="2"/>
      <text x="-156" y="97" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#b35a39" font-weight="600">BNK</text>
    </g>
  </g>

  <text x="540" y="1180" text-anchor="middle" font-family="'Inter', sans-serif" font-size="28" fill="#5c524a" font-weight="500">Tokenised deposits: bank money on shared rails.</text>
  <text x="540" y="1220" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" fill="#8a8178" font-style="italic">Not crypto. Not a CBDC. Not for sale.</text>

  <text x="100" y="1300" font-family="'JetBrains Mono', monospace" font-size="22" fill="#b35a39" font-weight="600" letter-spacing="2">duitful.app  ·  Swipe →</text>
</svg>
