<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e3d6bf"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98866"/>
      <stop offset="1" stop-color="#b35a39"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <text x="100" y="160" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="5" fill="#6b5e52" font-weight="500">THE 30-DAY MEASUREMENT PLAN</text>
  <g transform="translate(900, 140)">
    <rect width="80" height="40" rx="20" fill="#fffaf2" stroke="#e3d6bf"/>
    <text x="40" y="27" font-family="'JetBrains Mono', monospace" font-size="18" fill="#b35a39" text-anchor="middle" font-weight="600" letter-spacing="2">5/5</text>
  </g>

  <text x="100" y="320" font-family="'Fraunces', 'Georgia', serif" font-size="80" font-weight="500" fill="#2a2420">Measure it.</text>
  <text x="100" y="410" font-family="'Fraunces', 'Georgia', serif" font-size="80" font-weight="500" fill="#2a2420">Don't <tspan font-style="italic" fill="#b35a39">guess</tspan> it.</text>

  <!-- 3-step strip -->
  <g transform="translate(80, 540)" font-family="'Inter', sans-serif" fill="#2a2420">
    <g transform="translate(0,0)">
      <circle cx="32" cy="32" r="32" fill="#fffaf2" stroke="url(#primary)" stroke-width="3"/>
      <text x="32" y="42" text-anchor="middle" font-family="'Fraunces', serif" font-size="30" fill="#b35a39" font-weight="500">1</text>
      <text x="84" y="28" font-size="26" font-weight="600">Read your last 4 weeks of</text>
      <text x="84" y="58" font-size="26" font-weight="600">Petrol, Toll, Electricity, Food.</text>
    </g>
    <g transform="translate(0, 110)">
      <circle cx="32" cy="32" r="32" fill="#fffaf2" stroke="url(#primary)" stroke-width="3"/>
      <text x="32" y="42" text-anchor="middle" font-family="'Fraunces', serif" font-size="30" fill="#b35a39" font-weight="500">2</text>
      <text x="84" y="28" font-size="26" font-weight="600">Run the new pattern for 4 weeks.</text>
      <text x="84" y="58" font-size="26" font-weight="600">Tag every relevant expense.</text>
    </g>
    <g transform="translate(0, 220)">
      <circle cx="32" cy="32" r="32" fill="#fffaf2" stroke="url(#primary)" stroke-width="3"/>
      <text x="32" y="42" text-anchor="middle" font-family="'Fraunces', serif" font-size="30" fill="#b35a39" font-weight="500">3</text>
      <text x="84" y="28" font-size="26" font-weight="600">Pull Reports. Compare totals.</text>
      <text x="84" y="58" font-size="26" font-weight="600">That's your WFH dividend.</text>
    </g>
  </g>

  <!-- CTA card -->
  <g transform="translate(80, 990)">
    <rect width="920" height="220" rx="24" fill="url(#primary)"/>
    <text x="460" y="80" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="20" fill="#fffaf2" letter-spacing="4" opacity="0.85">READ THE FULL GUIDE</text>
    <text x="460" y="150" text-anchor="middle" font-family="'Fraunces', serif" font-size="44" font-weight="500" fill="#fffaf2">duitful.app/guides/</text>
    <text x="460" y="195" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="22" fill="#fffaf2" letter-spacing="1.5">selangor-wfh-energy-shock-2026</text>
  </g>

  <text x="540" y="1300" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" fill="#5c524a" font-style="italic">@duitful.app · Private money &amp; debt tracker, Malaysia</text>
</svg>
