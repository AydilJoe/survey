<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e3d6bf"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <text x="100" y="160" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="5" fill="#6b5e52" font-weight="500">WHERE THE SAVINGS COME FROM</text>
  <g transform="translate(900, 140)">
    <rect width="80" height="40" rx="20" fill="#fffaf2" stroke="#e3d6bf"/>
    <text x="40" y="27" font-family="'JetBrains Mono', monospace" font-size="18" fill="#b35a39" text-anchor="middle" font-weight="600" letter-spacing="2">3/5</text>
  </g>

  <text x="100" y="290" font-family="'Fraunces', 'Georgia', serif" font-size="72" font-weight="500" fill="#2a2420">Four buckets.</text>
  <text x="100" y="370" font-family="'Fraunces', 'Georgia', serif" font-size="72" font-weight="500" fill="#2a2420"><tspan font-style="italic" fill="#b35a39">Two reliable.</tspan> Two slow.</text>

  <!-- Rows -->
  <g transform="translate(80, 480)" font-family="'Inter', sans-serif" fill="#2a2420">
    <!-- Row 1 -->
    <g transform="translate(0,0)">
      <rect width="920" height="160" rx="20" fill="#fffaf2" stroke="#e3d6bf"/>
      <circle cx="60" cy="80" r="28" fill="#8fa078"/>
      <path d="M48 80 l10 10 l16 -16" stroke="#fffaf2" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="115" y="78" font-size="32" font-weight="600">Petrol + tolls</text>
      <text x="115" y="118" font-size="22" fill="#5c524a">The obvious one. Two fewer commutes a week.</text>
    </g>
    <!-- Row 2 -->
    <g transform="translate(0, 180)">
      <rect width="920" height="160" rx="20" fill="#fffaf2" stroke="#e3d6bf"/>
      <circle cx="60" cy="80" r="28" fill="#8fa078"/>
      <path d="M48 80 l10 10 l16 -16" stroke="#fffaf2" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="115" y="78" font-size="32" font-weight="600">Lunch &amp; coffee</text>
      <text x="115" y="118" font-size="22" fill="#5c524a">The silent one. WFH meals beat kopitiam every time.</text>
    </g>
    <!-- Row 3 - offset (electricity goes UP) -->
    <g transform="translate(0, 360)">
      <rect width="920" height="160" rx="20" fill="#fffaf2" stroke="#e3d6bf"/>
      <circle cx="60" cy="80" r="28" fill="#b86a4e"/>
      <path d="M50 80 h20 M50 80 l10 -8 M50 80 l10 8" stroke="#fffaf2" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="115" y="78" font-size="32" font-weight="600">Home electricity</text>
      <text x="115" y="118" font-size="22" fill="#5c524a">The offset. Aircon &amp; lights at home — track this.</text>
    </g>
    <!-- Row 4 -->
    <g transform="translate(0, 540)">
      <rect width="920" height="160" rx="20" fill="#fffaf2" stroke="#e3d6bf"/>
      <circle cx="60" cy="80" r="28" fill="#d4a574"/>
      <text x="60" y="92" text-anchor="middle" fill="#fffaf2" font-size="28" font-weight="700">~</text>
      <text x="115" y="78" font-size="32" font-weight="600">Vehicle wear</text>
      <text x="115" y="118" font-size="22" fill="#5c524a">The slow one. Shows up at month nine, not month one.</text>
    </g>
  </g>

  <text x="540" y="1310" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="22" fill="#b35a39" font-weight="600" letter-spacing="2">duitful.app</text>
</svg>
