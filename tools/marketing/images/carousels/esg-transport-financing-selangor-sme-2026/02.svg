<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e3d6bf"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98866"/>
      <stop offset="1" stop-color="#b35a39"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <text x="100" y="160" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="5" fill="#6b5e52" font-weight="500">WHAT'S ON THE MENU</text>
  <g transform="translate(900, 140)"><rect width="80" height="40" rx="20" fill="#fffaf2" stroke="#e3d6bf"/><text x="40" y="27" font-family="'JetBrains Mono', monospace" font-size="18" fill="#b35a39" text-anchor="middle" font-weight="600" letter-spacing="2">2/5</text></g>

  <text x="100" y="290" font-family="'Fraunces', 'Georgia', serif" font-size="68" font-weight="500" fill="#2a2420">Four products. <tspan font-style="italic" fill="#b35a39">Lighter</tspan></text>
  <text x="100" y="370" font-family="'Fraunces', 'Georgia', serif" font-size="68" font-weight="500" fill="#b35a39" font-style="italic">paperwork than before.</text>

  <g transform="translate(80, 470)" font-family="'Inter', sans-serif" fill="#2a2420">
    <g>
      <rect width="920" height="155" rx="22" fill="#fffaf2" stroke="#e3d6bf"/>
      <circle cx="60" cy="78" r="32" fill="#fffaf2" stroke="url(#primary)" stroke-width="3"/>
      <text x="60" y="89" text-anchor="middle" font-family="'Fraunces', serif" font-size="32" fill="#b35a39" font-weight="500">1</text>
      <text x="130" y="65" font-size="26" font-weight="600">Sustainability-linked overdrafts</text>
      <text x="130" y="100" font-size="20" fill="#5c524a">25–75 bps cut tied to an emissions KPI.</text>
      <text x="130" y="128" font-size="18" fill="#8a8178" font-style="italic">Conversion of an existing OD = paperwork only.</text>
    </g>
    <g transform="translate(0, 175)">
      <rect width="920" height="155" rx="22" fill="#fffaf2" stroke="#e3d6bf"/>
      <circle cx="60" cy="78" r="32" fill="#fffaf2" stroke="url(#primary)" stroke-width="3"/>
      <text x="60" y="89" text-anchor="middle" font-family="'Fraunces', serif" font-size="32" fill="#b35a39" font-weight="500">2</text>
      <text x="130" y="65" font-size="26" font-weight="600">Green term loans, 5–10 yr</text>
      <text x="130" y="100" font-size="20" fill="#5c524a">BLR-based · 50–100 bps green discount, step-up.</text>
      <text x="130" y="128" font-size="18" fill="#8a8178" font-style="italic">For vehicles · charging · workshop fit-out.</text>
    </g>
    <g transform="translate(0, 350)">
      <rect width="920" height="155" rx="22" fill="#fffaf2" stroke="#e3d6bf"/>
      <circle cx="60" cy="78" r="32" fill="#fffaf2" stroke="url(#primary)" stroke-width="3"/>
      <text x="60" y="89" text-anchor="middle" font-family="'Fraunces', serif" font-size="32" fill="#b35a39" font-weight="500">3</text>
      <text x="130" y="65" font-size="26" font-weight="600">Grant-matching, 1:1 to RM 100k–500k</text>
      <text x="130" y="100" font-size="20" fill="#5c524a">SME Corp / MGTC / state agencies.</text>
      <text x="130" y="128" font-size="18" fill="#8a8178" font-style="italic">Paid against verified invoices, not advance.</text>
    </g>
    <g transform="translate(0, 525)">
      <rect width="920" height="155" rx="22" fill="#fffaf2" stroke="#e3d6bf"/>
      <circle cx="60" cy="78" r="32" fill="#fffaf2" stroke="url(#primary)" stroke-width="3"/>
      <text x="60" y="89" text-anchor="middle" font-family="'Fraunces', serif" font-size="32" fill="#b35a39" font-weight="500">4</text>
      <text x="130" y="65" font-size="26" font-weight="600">Sustainability-linked invoice financing</text>
      <text x="130" y="100" font-size="20" fill="#5c524a">Preferential rates if buyer reports Scope 3.</text>
      <text x="130" y="128" font-size="18" fill="#8a8178" font-style="italic">Most large logistics buyers now do.</text>
    </g>
  </g>

  <text x="100" y="1300" font-family="'JetBrains Mono', monospace" font-size="22" fill="#b35a39" font-weight="600" letter-spacing="2">duitful.app</text>
</svg>
