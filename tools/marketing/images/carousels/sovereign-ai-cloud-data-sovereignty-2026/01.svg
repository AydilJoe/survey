      <path d="M-110 -90 q-10 30 0 60 q15 35 20 70 q5 25 -10 35 q-25 0 -30 -25 q-15 -35 -10 -75 q5 -35 30 -65 z"/>
      <path d="M30 -40 q40 -10 90 0 q30 8 50 30 q10 20 -10 35 q-50 8 -100 -5 q-30 -15 -30 -40 z"/>
    </g>
    <text y="170" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="18" fill="#5c524a" letter-spacing="3">DATA STAYS HERE</text>
  </g>

  <text x="540" y="1180" text-anchor="middle" font-family="'Inter', sans-serif" font-size="26" fill="#5c524a" font-weight="500">On-shore is now the baseline.</text>
  <text x="540" y="1212" text-anchor="middle" font-family="'Inter', sans-serif" font-size="26" fill="#5c524a" font-weight="500">On-device is the ceiling.</text>

  <text x="100" y="1300" font-family="'JetBrains Mono', monospace" font-size="22" fill="#b35a39" font-weight="600" letter-spacing="2">duitful.app  ·  Swipe →</text>
