      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e3d6bf"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98866"/>
      <stop offset="1" stop-color="#b35a39"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <text x="100" y="160" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="5" fill="#6b5e52" font-weight="500">SOVEREIGN AI CLOUD · MAY 4</text>
  <g transform="translate(900, 140)"><rect width="80" height="40" rx="20" fill="#fffaf2" stroke="#e3d6bf"/><text x="40" y="27" font-family="'JetBrains Mono', monospace" font-size="18" fill="#b35a39" text-anchor="middle" font-weight="600" letter-spacing="2">1/5</text></g>

  <text x="100" y="320" font-family="'Fraunces', 'Georgia', serif" font-size="74" font-weight="500" fill="#2a2420">"Private by default"</text>
  <text x="100" y="410" font-family="'Fraunces', 'Georgia', serif" font-size="74" font-weight="500" fill="#2a2420">just became the</text>
  <text x="100" y="500" font-family="'Fraunces', 'Georgia', serif" font-size="74" font-weight="500" fill="#b35a39" font-style="italic">Malaysian floor.</text>

  <!-- Map of Malaysia outline as visual -->
