<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e3d6bf"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98866"/>
      <stop offset="1" stop-color="#b35a39"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <text x="100" y="160" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="5" fill="#6b5e52" font-weight="500">EVALUATE ANY "PRIVATE" APP</text>
  <g transform="translate(900, 140)"><rect width="80" height="40" rx="20" fill="#fffaf2" stroke="#e3d6bf"/><text x="40" y="27" font-family="'JetBrains Mono', monospace" font-size="18" fill="#b35a39" text-anchor="middle" font-weight="600" letter-spacing="2">4/5</text></g>

  <text x="100" y="290" font-family="'Fraunces', 'Georgia', serif" font-size="68" font-weight="500" fill="#2a2420">Three questions to</text>
  <text x="100" y="370" font-family="'Fraunces', 'Georgia', serif" font-size="68" font-weight="500" fill="#2a2420">ask <tspan font-style="italic" fill="#b35a39">any app</tspan>.</text>

  <g transform="translate(80, 460)" font-family="'Inter', sans-serif" fill="#2a2420">
    <g>
      <rect width="920" height="200" rx="22" fill="#fffaf2" stroke="#e3d6bf"/>
      <circle cx="60" cy="100" r="36" fill="url(#primary)"/>
      <text x="60" y="113" text-anchor="middle" fill="#fffaf2" font-family="'Fraunces', serif" font-size="32" font-weight="500">?</text>
      <text x="130" y="80" font-size="28" font-weight="600">Where is your data right now?</text>
      <text x="130" y="120" font-size="20" fill="#5c524a">"In our cloud" = on-shore. Useful, but server-side.</text>
      <text x="130" y="155" font-size="20" fill="#5c524a">"On your phone, encrypted" = on-device. Smaller class.</text>
    </g>
    <g transform="translate(0, 220)">
      <rect width="920" height="200" rx="22" fill="#fffaf2" stroke="#e3d6bf"/>
      <circle cx="60" cy="100" r="36" fill="url(#primary)"/>
      <text x="60" y="113" text-anchor="middle" fill="#fffaf2" font-family="'Fraunces', serif" font-size="32" font-weight="500">?</text>
      <text x="130" y="80" font-size="28" font-weight="600">Can the developer read your data?</text>
      <text x="130" y="120" font-size="20" fill="#5c524a">"No" only works with end-to-end encryption.</text>
      <text x="130" y="155" font-size="20" fill="#5c524a">Anything else is "we choose not to" — until they don't.</text>
    </g>
    <g transform="translate(0, 440)">
      <rect width="920" height="200" rx="22" fill="#fffaf2" stroke="#e3d6bf"/>
      <circle cx="60" cy="100" r="36" fill="url(#primary)"/>
      <text x="60" y="113" text-anchor="middle" fill="#fffaf2" font-family="'Fraunces', serif" font-size="32" font-weight="500">?</text>
      <text x="130" y="80" font-size="28" font-weight="600">Does it require an account?</text>
      <text x="130" y="120" font-size="20" fill="#5c524a">Account = a leak surface. No account = no surface.</text>
      <text x="130" y="155" font-size="20" fill="#5c524a">Trade-off: passphrase recovery is on you.</text>
    </g>
  </g>

  <text x="100" y="1300" font-family="'JetBrains Mono', monospace" font-size="22" fill="#b35a39" font-weight="600" letter-spacing="2">duitful.app</text>
</svg>
