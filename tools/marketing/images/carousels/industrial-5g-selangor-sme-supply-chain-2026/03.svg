<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e3d6bf"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98866"/>
      <stop offset="1" stop-color="#b35a39"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <text x="100" y="160" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="5" fill="#6b5e52" font-weight="500">CAPEX TO EXPECT</text>
  <g transform="translate(900, 140)">
    <rect width="80" height="40" rx="20" fill="#fffaf2" stroke="#e3d6bf"/>
    <text x="40" y="27" font-family="'JetBrains Mono', monospace" font-size="18" fill="#b35a39" text-anchor="middle" font-weight="600" letter-spacing="2">3/5</text>
  </g>

  <text x="100" y="290" font-family="'Fraunces', 'Georgia', serif" font-size="68" font-weight="500" fill="#2a2420">Budget for these</text>
  <text x="100" y="370" font-family="'Fraunces', 'Georgia', serif" font-size="68" font-weight="500" fill="#2a2420">before <tspan font-style="italic" fill="#b35a39">tendering</tspan>.</text>

  <!-- Capex rows -->
  <g transform="translate(80, 470)" font-family="'Inter', sans-serif">
    <g>
      <rect width="920" height="140" rx="20" fill="#fffaf2" stroke="#e3d6bf"/>
      <text x="40" y="60" font-size="28" font-weight="600" fill="#2a2420">Connectivity upgrade</text>
      <text x="40" y="100" font-size="20" fill="#5c524a">Fibre, 5G devices, possibly private-5G modules.</text>
      <text x="900" y="80" text-anchor="end" font-family="'Fraunces', serif" font-size="36" font-weight="500" fill="#b35a39">RM 1.5–8k</text>
    </g>
    <g transform="translate(0, 160)">
      <rect width="920" height="140" rx="20" fill="#fffaf2" stroke="#e3d6bf"/>
      <text x="40" y="60" font-size="28" font-weight="600" fill="#2a2420">E-invoice middleware</text>
      <text x="40" y="100" font-size="20" fill="#5c524a">LHDN MyInvois cutover. Free up to 100/mo.</text>
      <text x="900" y="80" text-anchor="end" font-family="'Fraunces', serif" font-size="36" font-weight="500" fill="#b35a39">RM 0–6k/yr</text>
    </g>
    <g transform="translate(0, 320)">
      <rect width="920" height="140" rx="20" fill="#fffaf2" stroke="#e3d6bf"/>
      <text x="40" y="60" font-size="28" font-weight="600" fill="#2a2420">Certifications &amp; audits</text>
      <text x="40" y="100" font-size="20" fill="#5c524a">ISO 9001, ISO 27001, OSHA/DOSH where required.</text>
      <text x="900" y="80" text-anchor="end" font-family="'Fraunces', serif" font-size="36" font-weight="500" fill="#b35a39">RM 2–25k</text>
    </g>
    <g transform="translate(0, 480)">
      <rect width="920" height="140" rx="20" fill="#fffaf2" stroke="#e3d6bf"/>
      <text x="40" y="60" font-size="28" font-weight="600" fill="#2a2420">Skills upgrade · 1–2 staff</text>
      <text x="40" y="100" font-size="20" fill="#5c524a">Industrial Ethernet, OPC-UA, OT/IT bridging basics.</text>
      <text x="900" y="80" text-anchor="end" font-family="'Fraunces', serif" font-size="36" font-weight="500" fill="#b35a39">RM 1.5–4k</text>
    </g>
  </g>

  <text x="540" y="1230" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" fill="#5c524a" font-style="italic">Amortise across the contract you're chasing.</text>
  <text x="540" y="1262" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" fill="#5c524a" font-style="italic">Don't buy hardware until you have a signed PO.</text>

  <text x="100" y="1320" font-family="'JetBrains Mono', monospace" font-size="22" fill="#b35a39" font-weight="600" letter-spacing="2">duitful.app</text>
</svg>
