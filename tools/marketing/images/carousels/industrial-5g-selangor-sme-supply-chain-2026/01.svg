<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e3d6bf"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98866"/>
      <stop offset="1" stop-color="#b35a39"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <text x="100" y="160" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="5" fill="#6b5e52" font-weight="500">NAIO · AI NATION 2030</text>
  <g transform="translate(900, 140)">
    <rect width="80" height="40" rx="20" fill="#fffaf2" stroke="#e3d6bf"/>
    <text x="40" y="27" font-family="'JetBrains Mono', monospace" font-size="18" fill="#b35a39" text-anchor="middle" font-weight="600" letter-spacing="2">1/5</text>
  </g>

  <text x="100" y="320" font-family="'Fraunces', 'Georgia', serif" font-size="74" font-weight="500" fill="#2a2420">Selangor's smart</text>
  <text x="100" y="400" font-family="'Fraunces', 'Georgia', serif" font-size="74" font-weight="500" fill="#2a2420">factories are about</text>
  <text x="100" y="480" font-family="'Fraunces', 'Georgia', serif" font-size="74" font-weight="500" fill="#b35a39" font-style="italic">to upgrade.</text>

  <!-- Visual: factory -> small SME -->
  <g transform="translate(80, 620)">
    <!-- Big factory -->
    <g>
      <rect x="0" y="60" width="320" height="200" rx="16" fill="url(#primary)"/>
      <rect x="80" y="0" width="40" height="80" fill="url(#primary)"/>
      <rect x="160" y="0" width="40" height="80" fill="url(#primary)"/>
      <text x="160" y="170" text-anchor="middle" font-family="'Fraunces', serif" font-size="32" fill="#fffaf2" font-weight="500">Smart factory</text>
      <text x="160" y="210" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#fffaf2" opacity="0.85" letter-spacing="2">PRIVATE 5G</text>
    </g>
    <!-- Arrow -->
    <g transform="translate(380, 130)" stroke="#5c524a" stroke-width="3" fill="none" stroke-linecap="round">
      <line x1="0" y1="0" x2="120" y2="0"/>
      <path d="M105 -12 l15 12 l-15 12"/>
    </g>
    <!-- SME boxes -->
    <g transform="translate(560, 30)">
      <rect width="120" height="100" rx="12" fill="#fffaf2" stroke="#8fa078" stroke-width="2"/>
      <text x="60" y="55" text-anchor="middle" font-family="'Fraunces', serif" font-size="20" fill="#5a7c4f" font-weight="500">Components</text>
      <text x="60" y="80" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8a8178">SME</text>
    </g>
    <g transform="translate(700, 30)">
      <rect width="120" height="100" rx="12" fill="#fffaf2" stroke="#8fa078" stroke-width="2"/>
      <text x="60" y="55" text-anchor="middle" font-family="'Fraunces', serif" font-size="20" fill="#5a7c4f" font-weight="500">Logistics</text>
      <text x="60" y="80" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8a8178">SME</text>
    </g>
    <g transform="translate(560, 150)">
      <rect width="120" height="100" rx="12" fill="#fffaf2" stroke="#8fa078" stroke-width="2"/>
      <text x="60" y="55" text-anchor="middle" font-family="'Fraunces', serif" font-size="20" fill="#5a7c4f" font-weight="500">Fit-out</text>
      <text x="60" y="80" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8a8178">SME</text>
    </g>
    <g transform="translate(700, 150)">
      <rect width="120" height="100" rx="12" fill="#fffaf2" stroke="#8fa078" stroke-width="2"/>
      <text x="60" y="55" text-anchor="middle" font-family="'Fraunces', serif" font-size="20" fill="#5a7c4f" font-weight="500">IT services</text>
      <text x="60" y="80" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8a8178">SME</text>
    </g>
  </g>

  <text x="540" y="1050" text-anchor="middle" font-family="'Fraunces', 'Georgia', serif" font-size="50" font-weight="500" fill="#2a2420">So must their <tspan font-style="italic" fill="#b35a39">suppliers</tspan>.</text>

  <text x="540" y="1180" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" fill="#5c524a">Private 5G + AI Nation 2030 = digital procurement gates.</text>
  <text x="540" y="1212" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" fill="#5c524a">If you sell into manufacturing, the bar just moved.</text>

  <text x="100" y="1300" font-family="'JetBrains Mono', monospace" font-size="22" fill="#b35a39" font-weight="600" letter-spacing="2">duitful.app  ·  Swipe →</text>
</svg>
