<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e3d6bf"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <text x="100" y="160" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="5" fill="#6b5e52" font-weight="500">THREE THINGS CHANGE</text>
  <g transform="translate(900, 140)">
    <rect width="80" height="40" rx="20" fill="#fffaf2" stroke="#e3d6bf"/>
    <text x="40" y="27" font-family="'JetBrains Mono', monospace" font-size="18" fill="#b35a39" text-anchor="middle" font-weight="600" letter-spacing="2">2/5</text>
  </g>

  <text x="100" y="290" font-family="'Fraunces', 'Georgia', serif" font-size="68" font-weight="500" fill="#2a2420">For your SME.</text>

  <!-- 3 numbered cards -->
  <g transform="translate(80, 380)" font-family="'Inter', sans-serif" fill="#2a2420">
    <g>
      <rect width="920" height="240" rx="22" fill="#fffaf2" stroke="#e3d6bf"/>
      <circle cx="60" cy="60" r="40" fill="#fffaf2" stroke="#b35a39" stroke-width="3"/>
      <text x="60" y="74" text-anchor="middle" font-family="'Fraunces', serif" font-size="40" fill="#b35a39" font-weight="500">1</text>
      <text x="120" y="65" font-size="32" font-weight="600">Onboarding goes digital-first</text>
      <text x="120" y="100" font-size="22" fill="#5c524a">SSM, e-invoice readiness, certifications, bank details</text>
      <text x="120" y="130" font-size="22" fill="#5c524a">— all upfront on portals (SAP Ariba, Coupa, in-house).</text>
      <text x="120" y="180" font-size="20" fill="#8a8178" font-style="italic">Manual back-and-forth tendering is exiting fast.</text>
    </g>
    <g transform="translate(0, 270)">
      <rect width="920" height="240" rx="22" fill="#fffaf2" stroke="#e3d6bf"/>
      <circle cx="60" cy="60" r="40" fill="#fffaf2" stroke="#b35a39" stroke-width="3"/>
      <text x="60" y="74" text-anchor="middle" font-family="'Fraunces', serif" font-size="40" fill="#b35a39" font-weight="500">2</text>
      <text x="120" y="65" font-size="32" font-weight="600">Payment terms standardise</text>
      <text x="120" y="100" font-size="22" fill="#5c524a">Smart-factory ERP + bank rails = predictable runs.</text>
      <text x="120" y="130" font-size="22" fill="#5c524a">Net 30 default; Net 14 for early-cohort suppliers.</text>
      <text x="120" y="180" font-size="20" fill="#8a8178" font-style="italic">Fewer 90-day surprises — but plan cashflow tightly.</text>
    </g>
    <g transform="translate(0, 540)">
      <rect width="920" height="240" rx="22" fill="#fffaf2" stroke="#e3d6bf"/>
      <circle cx="60" cy="60" r="40" fill="#fffaf2" stroke="#b35a39" stroke-width="3"/>
      <text x="60" y="74" text-anchor="middle" font-family="'Fraunces', serif" font-size="40" fill="#b35a39" font-weight="500">3</text>
      <text x="120" y="65" font-size="32" font-weight="600">Capex hits before revenue</text>
      <text x="120" y="100" font-size="22" fill="#5c524a">Connectivity, e-invoice middleware, certs, training.</text>
      <text x="120" y="130" font-size="22" fill="#5c524a">Lands 30–90 days before the first invoice clears.</text>
      <text x="120" y="180" font-size="20" fill="#8a8178" font-style="italic">Treat as project cost, not sunk overhead.</text>
    </g>
  </g>

  <text x="100" y="1300" font-family="'JetBrains Mono', monospace" font-size="22" fill="#b35a39" font-weight="600" letter-spacing="2">duitful.app</text>
</svg>
