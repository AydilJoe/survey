<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e3d6bf"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98866"/>
      <stop offset="1" stop-color="#b35a39"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <text x="100" y="160" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="5" fill="#6b5e52" font-weight="500">MALAYSIA · DEBT REALITY CHECK</text>
  <g transform="translate(900, 140)"><rect width="80" height="40" rx="20" fill="#fffaf2" stroke="#e3d6bf"/><text x="40" y="27" font-family="'JetBrains Mono', monospace" font-size="18" fill="#b35a39" text-anchor="middle" font-weight="600" letter-spacing="2">1/5</text></g>

  <!-- Headline -->
  <text x="100" y="320" font-family="'Fraunces', 'Georgia', serif" font-size="80" font-weight="500" fill="#2a2420">Two numbers</text>
  <text x="100" y="410" font-family="'Fraunces', 'Georgia', serif" font-size="80" font-weight="500" fill="#2a2420">Malaysians</text>
  <text x="100" y="500" font-family="'Fraunces', 'Georgia', serif" font-size="80" font-weight="500" fill="#b35a39" font-style="italic">don't talk about</text>
  <text x="100" y="590" font-family="'Fraunces', 'Georgia', serif" font-size="80" font-weight="500" fill="#2a2420">enough.</text>

  <!-- Two preview cards -->
  <g transform="translate(80, 720)" font-family="'Inter', sans-serif">
    <!-- Card 1 -->
    <g>
      <rect width="445" height="320" rx="22" fill="#fffaf2" stroke="url(#primary)" stroke-width="2"/>
      <text x="40" y="60" font-family="'JetBrains Mono', monospace" font-size="16" fill="#8a8178" letter-spacing="3">YOUNG MALAYSIANS</text>
      <text x="40" y="160" font-family="'Fraunces', serif" font-size="64" font-weight="500" fill="#b35a39" font-style="italic">going</text>
      <text x="40" y="230" font-family="'Fraunces', serif" font-size="64" font-weight="500" fill="#b35a39" font-style="italic">bankrupt.</text>
      <text x="40" y="285" font-size="18" fill="#5c524a">MDI bankruptcy filings, top causes &amp; cohort.</text>
    </g>
    <!-- Card 2 -->
    <g transform="translate(475, 0)">
      <rect width="445" height="320" rx="22" fill="#fffaf2" stroke="url(#primary)" stroke-width="2"/>
      <text x="40" y="60" font-family="'JetBrains Mono', monospace" font-size="16" fill="#8a8178" letter-spacing="3">RETIREES</text>
      <text x="40" y="160" font-family="'Fraunces', serif" font-size="64" font-weight="500" fill="#b35a39" font-style="italic">still</text>
      <text x="40" y="230" font-family="'Fraunces', serif" font-size="64" font-weight="500" fill="#b35a39" font-style="italic">working.</text>
      <text x="40" y="285" font-size="18" fill="#5c524a">KWSP retirement-funding gap, in real ringgit.</text>
    </g>
  </g>

  <text x="540" y="1110" text-anchor="middle" font-family="'Inter', sans-serif" font-size="24" fill="#5c524a" font-style="italic">Both share one thing in common.</text>

  <text x="100" y="1300" font-family="'JetBrains Mono', monospace" font-size="22" fill="#b35a39" font-weight="600" letter-spacing="2">duitful.app  ·  Swipe →</text>
</svg>
