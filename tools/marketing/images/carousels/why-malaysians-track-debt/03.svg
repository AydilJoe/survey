<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e3d6bf"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98866"/>
      <stop offset="1" stop-color="#b35a39"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <text x="100" y="160" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="5" fill="#6b5e52" font-weight="500">RETIREMENT REALITY · KWSP</text>
  <g transform="translate(900, 140)"><rect width="80" height="40" rx="20" fill="#fffaf2" stroke="#e3d6bf"/><text x="40" y="27" font-family="'JetBrains Mono', monospace" font-size="18" fill="#b35a39" text-anchor="middle" font-weight="600" letter-spacing="2">3/5</text></g>

  <text x="100" y="290" font-family="'Fraunces', 'Georgia', serif" font-size="68" font-weight="500" fill="#2a2420">At 55. Most</text>
  <text x="100" y="370" font-family="'Fraunces', 'Georgia', serif" font-size="68" font-weight="500" fill="#2a2420">Malaysians are</text>
  <text x="100" y="450" font-family="'Fraunces', 'Georgia', serif" font-size="68" font-weight="500" fill="#b35a39" font-style="italic">underfunded.</text>

  <!-- Two ticket-style cards -->
  <g transform="translate(80, 540)" font-family="'Inter', sans-serif">
    <g>
      <rect width="920" height="180" rx="22" fill="#fffaf2" stroke="#e3d6bf"/>
      <text x="40" y="60" font-family="'JetBrains Mono', monospace" font-size="18" fill="#8a8178" letter-spacing="3">EPF "BELANJAWANKU" · KL SINGLE RETIREE</text>
      <text x="40" y="120" font-family="'Fraunces', serif" font-size="44" font-weight="500" fill="#2a2420">RM 2,600 / month</text>
      <text x="40" y="160" font-size="20" fill="#5c524a">Basic-needs threshold for an aging single in KL.</text>
    </g>
    <g transform="translate(0, 200)">
      <rect width="920" height="180" rx="22" fill="url(#primary)"/>
      <text x="40" y="60" font-family="'JetBrains Mono', monospace" font-size="18" fill="#fffaf2" letter-spacing="3" opacity="0.9">MEDIAN EPF BALANCE AT 55</text>
      <text x="40" y="120" font-family="'Fraunces', serif" font-size="44" font-weight="500" fill="#fffaf2">Below the threshold.</text>
      <text x="40" y="160" font-size="20" fill="#fffaf2">Most members have less than 5 years' worth at this rate.</text>
    </g>
  </g>

  <!-- Outcome -->
  <g transform="translate(80, 980)">
    <rect width="920" height="180" rx="22" fill="#fffaf2" stroke="#b35a39" stroke-width="2"/>
    <text x="40" y="60" font-family="'JetBrains Mono', monospace" font-size="18" fill="#8a8178" letter-spacing="3">REAL CONSEQUENCE</text>
    <text x="40" y="115" font-family="'Fraunces', serif" font-size="34" font-weight="500" fill="#2a2420">A growing share of Malaysians work past 60.</text>
    <text x="40" y="155" font-size="20" fill="#5c524a">Not by choice. To cover basic costs.</text>
  </g>

  <text x="540" y="1240" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" fill="#8a8178" font-style="italic">Source: KWSP Belanjawanku · EPF withdrawal pattern data.</text>

  <text x="100" y="1300" font-family="'JetBrains Mono', monospace" font-size="22" fill="#b35a39" font-weight="600" letter-spacing="2">duitful.app</text>
</svg>
