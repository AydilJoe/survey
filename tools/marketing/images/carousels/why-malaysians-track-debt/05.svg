<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e3d6bf"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98866"/>
      <stop offset="1" stop-color="#b35a39"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <text x="100" y="160" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="5" fill="#6b5e52" font-weight="500">THE LEVER</text>
  <g transform="translate(900, 140)"><rect width="80" height="40" rx="20" fill="#fffaf2" stroke="#e3d6bf"/><text x="40" y="27" font-family="'JetBrains Mono', monospace" font-size="18" fill="#b35a39" text-anchor="middle" font-weight="600" letter-spacing="2">5/5</text></g>

  <text x="100" y="320" font-family="'Fraunces', 'Georgia', serif" font-size="80" font-weight="500" fill="#2a2420">Start with</text>
  <text x="100" y="410" font-family="'Fraunces', 'Georgia', serif" font-size="80" font-weight="500" fill="#b35a39" font-style="italic">one debt.</text>
  <text x="100" y="500" font-family="'Fraunces', 'Georgia', serif" font-size="80" font-weight="500" fill="#2a2420">Today.</text>

  <!-- Three bullets -->
  <g transform="translate(80, 600)" font-family="'Inter', sans-serif" fill="#2a2420">
    <g>
      <circle cx="14" cy="14" r="14" fill="#8fa078"/>
      <path d="M7 14 l5 5 l10 -10" stroke="#fffaf2" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="22" font-size="26">Add it: balance, APR, minimum payment.</text>
    </g>
    <g transform="translate(0, 56)">
      <circle cx="14" cy="14" r="14" fill="#8fa078"/>
      <path d="M7 14 l5 5 l10 -10" stroke="#fffaf2" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="22" font-size="26">See your real debt-free timeline.</text>
    </g>
    <g transform="translate(0, 112)">
      <circle cx="14" cy="14" r="14" fill="#8fa078"/>
      <path d="M7 14 l5 5 l10 -10" stroke="#fffaf2" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="22" font-size="26">Add RM 100 extra. Watch the timeline shrink.</text>
    </g>
  </g>

  <!-- CTA -->
  <g transform="translate(80, 850)">
    <rect width="920" height="280" rx="24" fill="url(#primary)"/>
    <text x="460" y="80" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="20" fill="#fffaf2" letter-spacing="4" opacity="0.85">PRIVATE DEBT TRACKER · MALAYSIA</text>
    <text x="460" y="170" text-anchor="middle" font-family="'Fraunces', serif" font-size="68" font-weight="500" fill="#fffaf2" font-style="italic">duitful.app</text>
    <text x="460" y="220" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" fill="#fffaf2" opacity="0.85">Free on web · On-device · No subscription</text>
  </g>

  <text x="540" y="1300" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" fill="#5c524a" font-style="italic">@duitful.app · Be duitful with your duit.</text>
</svg>
