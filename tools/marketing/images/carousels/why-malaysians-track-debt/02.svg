<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e3d6bf"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98866"/>
      <stop offset="1" stop-color="#b35a39"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <text x="100" y="160" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="5" fill="#6b5e52" font-weight="500">YOUNG &amp; BANKRUPT</text>
  <g transform="translate(900, 140)"><rect width="80" height="40" rx="20" fill="#fffaf2" stroke="#e3d6bf"/><text x="40" y="27" font-family="'JetBrains Mono', monospace" font-size="18" fill="#b35a39" text-anchor="middle" font-weight="600" letter-spacing="2">2/5</text></g>

  <!-- Large stat -->
  <g transform="translate(540, 460)">
    <text x="0" y="0" text-anchor="middle" font-family="'Fraunces', 'Georgia', serif" font-size="220" font-weight="500" fill="#b35a39" font-style="italic">Under 45.</text>
    <text x="0" y="80" text-anchor="middle" font-family="'Inter', sans-serif" font-size="32" fill="#5c524a" font-weight="500">The largest age cohort in Malaysian</text>
    <text x="0" y="120" text-anchor="middle" font-family="'Inter', sans-serif" font-size="32" fill="#5c524a" font-weight="500">bankruptcy filings — for over a decade.</text>
  </g>

  <!-- Causes -->
  <g transform="translate(80, 700)" font-family="'Inter', sans-serif">
    <text x="460" y="0" text-anchor="middle" font-size="22" fill="#8a8178" font-family="'JetBrains Mono', monospace" letter-spacing="3">TOP CAUSES · MDI</text>
    <g transform="translate(0, 40)">
      <rect width="920" height="80" rx="14" fill="#fffaf2" stroke="#e3d6bf"/>
      <text x="40" y="50" font-size="26" font-weight="600" fill="#2a2420">Personal loans</text>
      <text x="880" y="50" text-anchor="end" font-size="22" font-family="'JetBrains Mono', monospace" fill="#b35a39">most cited</text>
    </g>
    <g transform="translate(0, 140)">
      <rect width="920" height="80" rx="14" fill="#fffaf2" stroke="#e3d6bf"/>
      <text x="40" y="50" font-size="26" font-weight="600" fill="#2a2420">Hire-purchase (cars)</text>
      <text x="880" y="50" text-anchor="end" font-size="22" font-family="'JetBrains Mono', monospace" fill="#b35a39">second</text>
    </g>
    <g transform="translate(0, 240)">
      <rect width="920" height="80" rx="14" fill="#fffaf2" stroke="#e3d6bf"/>
      <text x="40" y="50" font-size="26" font-weight="600" fill="#2a2420">Credit card debt</text>
      <text x="880" y="50" text-anchor="end" font-size="22" font-family="'JetBrains Mono', monospace" fill="#b35a39">third</text>
    </g>
    <g transform="translate(0, 340)">
      <rect width="920" height="80" rx="14" fill="#fffaf2" stroke="#e3d6bf"/>
      <text x="40" y="50" font-size="26" font-weight="600" fill="#2a2420">Business loans / guarantees</text>
      <text x="880" y="50" text-anchor="end" font-size="22" font-family="'JetBrains Mono', monospace" fill="#b35a39">fourth</text>
    </g>
  </g>

  <text x="540" y="1240" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" fill="#8a8178" font-style="italic">Source: Malaysian Department of Insolvency (MDI).</text>
  <text x="540" y="1268" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" fill="#8a8178" font-style="italic">AKPK's Debt Management Programme: under-40 a leading enrolled cohort.</text>

  <text x="100" y="1320" font-family="'JetBrains Mono', monospace" font-size="22" fill="#b35a39" font-weight="600" letter-spacing="2">duitful.app</text>
</svg>
