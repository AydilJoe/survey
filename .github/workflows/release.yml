name: Release builds (signed AAB + IPA)

# Signed store builds, straight from CI.
#
#   android   a signed Android App Bundle (.aab) for the Play Console, plus
#             the R8 mapping file Play asks for.
#   ios       a signed App Store IPA (.ipa) — see ios.yml, lane signed-ipa.
#             Optionally uploaded to TestFlight too.
#
# Both land as workflow ARTIFACTS (Actions run page → Artifacts, kept 30
# days). The Android bundle is also published to Google Play: on a version
# tag, straight to Production at 100% (the owner's choice); by hand, to the
# track picked below, or not at all. Apple gets the iOS build only when you
# tick "TestFlight".
#
# When it runs:
#   - automatically, so users get a store update about once or twice a week
#     rather than on every merge. Both send Play Production at 100% plus
#     TestFlight (the App Store page is prepared, never submitted), then tag
#     the commit v<version>:
#       * a merge to main that raises the minor version (1.52.0 -> 1.53.0);
#       * every Tuesday, whatever version is on main if it is not tagged yet,
#         which is how patch bumps (1.52.1) reach the stores.
#     A patch bump is live on the web at once and waits for Tuesday in the
#     stores. Anything else on main releases nothing.
#   - on a version tag:  git tag v1.46.1 && git push origin v1.46.1
#     (the tag must match package.json, or the run stops before building)
#   - by hand: Actions → Release builds → Run workflow
#
# Not on every push to main, on purpose: a signed iOS build needs a macOS
# runner (~20 min) and mints a distribution certificate (Apple caps them), so
# it runs when the version changes, not on every merge.
#
# Secrets (Settings → Secrets and variables → Actions), set once — see
# ANDROID_BUILD.md and IOS_BUILD.md, "Signed builds from CI":
#   ANDROID_KEYSTORE_BASE64    base64 of your upload keystore (one line)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias, e.g. duitful
#   ANDROID_KEY_PASSWORD       key password
#   ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8     App Store Connect API key
#   PLAY_SERVICE_ACCOUNT_JSON  Google Play service-account key (JSON) — see
#                              ANDROID_BUILD.md, "Publishing to Google Play"
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [package.json]
  schedule:
    - cron: "17 3 * * 2" # Tuesday 03:17 UTC (11:17 in Malaysia)
  workflow_dispatch:
    inputs:
      android:
        description: "Build the signed Android bundle (.aab)"
        type: boolean
        default: true
      ios:
        description: "Build the signed iOS app (.ipa)"
        type: boolean
        default: true
      testflight:
        description: "Also upload the iOS build to TestFlight"
        type: boolean
        default: false
      play_track:
        description: "Publish the Android bundle to Google Play"
        type: choice
        default: production
        options:
          - production
          - beta
          - alpha
          - internal
          - none

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      # package.json is the one place the version lives; a tag that disagrees
      # with it would ship a build whose number is not the release's.
      - name: Read the version and check the tag
        id: v
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package.json version: $version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($version). Retag as v$version, or bump package.json."
            exit 1
          fi
          release=true
          # Automatic runs ship only a version that is not tagged yet, so a
          # re-run or a dependency bump ships nothing. A merge additionally
          # needs a new minor version; patch bumps wait for the weekly run.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || { [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ]; }; then
            if [ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
              echo "v$version is already tagged, nothing to release."; release=false
            elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
              before=""
              if git fetch -q --depth=1 origin "$BEFORE_SHA" 2>/dev/null; then
                before=$(git show "$BEFORE_SHA:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).version)}catch{}})")
              fi
              if [ "${before%.*}" = "${version%.*}" ]; then
                echo "Version $before -> $version is not a new minor version: it goes to the stores with Tuesday's release."; release=false
              fi
            fi
            if [ "$release" = true ]; then echo "Releasing $version to Play Production and TestFlight."; fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
        env:
          BEFORE_SHA: ${{ github.event.before }}

  android:
    needs: prepare
    if: ${{ needs.prepare.outputs.release == 'true' && (github.event_name != 'workflow_dispatch' || inputs.android) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Capacitor 7 needs JDK 21 (same as ci.yml).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Fails in seconds with a readable list, not 15 minutes in.
      - name: Check signing secrets are present
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$ANDROID_KEYSTORE_BASE64" ]   || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$ANDROID_KEY_ALIAS" ]         || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$ANDROID_KEY_PASSWORD" ]      || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):$missing — see ANDROID_BUILD.md, 'Signed builds from CI'."
            exit 1
          fi

      - run: npm ci

      - name: Generate android/ and apply the patch scripts
        run: |
          npm run cap:add:android
          npm run cap:sync

      # The keystore only ever exists on this runner, under RUNNER_TEMP, and
      # is deleted again at the end whatever happens.
      - name: Write the keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/duitful-upload.keystore"
          test -s "$RUNNER_TEMP/duitful-upload.keystore" || { echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an empty file"; exit 1; }
          echo "DUITFUL_KEYSTORE_FILE=$RUNNER_TEMP/duitful-upload.keystore" >> "$GITHUB_ENV"

      # Open the keystore with the secrets before a 2-minute build finds out
      # they are wrong. A line break pasted on the end of a secret (common
      # from Windows) is stripped here and by the signing step below.
      - name: Check the keystore opens with the secrets
        env:
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYPW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          PW=$(printf '%s' "$PW" | tr -d '\r\n'); ALIAS=$(printf '%s' "$ALIAS" | tr -d '\r\n'); KEYPW=$(printf '%s' "$KEYPW" | tr -d '\r\n')
          ks="$RUNNER_TEMP/duitful-upload.keystore"
          if ! keytool -list -keystore "$ks" -storepass "$PW" > /dev/null 2>&1; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD does not open the keystore. Re-enter it (the password keytool -list -v -keystore asks for)."
            exit 1
          fi
          if ! keytool -list -keystore "$ks" -storepass "$PW" -alias "$ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore opens, but has no key called ANDROID_KEY_ALIAS. Aliases in it:"
            keytool -list -keystore "$ks" -storepass "$PW" | grep -i "PrivateKeyEntry" || true
            exit 1
          fi
          type=$(keytool -list -keystore "$ks" -storepass "$PW" | sed -n 's/^Keystore type: //p')
          if [ "$type" = "PKCS12" ] && [ "$KEYPW" != "$PW" ]; then
            echo "::error::This is a PKCS12 keystore, which has one password for everything: set ANDROID_KEY_PASSWORD to the same value as ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi
          echo "Keystore ($type) opens; key '$ALIAS' found."
          keytool -list -v -keystore "$ks" -storepass "$PW" -alias "$ALIAS" | grep -E "SHA256:" | head -1

      # versionCode must exceed every code Play has already seen. Minutes
      # since 2025-01-01 UTC only ever rise, need no counter anyone has to
      # keep in step, and sit far above any hand-numbered earlier upload
      # (~1,000,000 now; Play's ceiling is 2,100,000,000).
      - name: Sign and version the build
        env:
          DUITFUL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DUITFUL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DUITFUL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DUITFUL_VERSION_NAME: ${{ needs.prepare.outputs.version }}
        run: |
          for v in DUITFUL_KEYSTORE_PASSWORD DUITFUL_KEY_ALIAS DUITFUL_KEY_PASSWORD; do export "$v=$(printf '%s' "${!v}" | tr -d '\r\n')"; done
          export DUITFUL_VERSION_CODE=$(( ($(date -u +%s) - 1735689600) / 60 ))
          echo "DUITFUL_VERSION_CODE=$DUITFUL_VERSION_CODE" >> "$GITHUB_ENV"
          echo "versionCode $DUITFUL_VERSION_CODE, versionName $DUITFUL_VERSION_NAME"
          node scripts/patch-android-signing.mjs

      - name: Build the signed release bundle
        working-directory: android
        shell: bash
        env:
          DUITFUL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DUITFUL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DUITFUL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in DUITFUL_KEYSTORE_PASSWORD DUITFUL_KEY_ALIAS DUITFUL_KEY_PASSWORD; do export "$v=$(printf '%s' "${!v}" | tr -d '\r\n')"; done
          set -o pipefail
          ./gradlew :app:bundleRelease --no-daemon --console=plain 2>&1 | tee build.log

      # jarsigner exits 0 even for an unsigned bundle, so read what it says.
      # Printing the SHA-256 lets you compare it with the upload certificate
      # in Play Console → App signing before you upload anything.
      - name: Verify the bundle is signed
        run: |
          aab=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$aab" || { echo "::error::$aab was not produced"; exit 1; }
          out=$(jarsigner -verify "$aab" 2>&1 || true)
          echo "$out" | head -5
          if ! echo "$out" | grep -q "jar verified" || echo "$out" | grep -qi "unsigned"; then
            echo "::error::The bundle is not signed."
            exit 1
          fi
          echo "Signing certificate:"
          keytool -printcert -jarfile "$aab" | grep -E "Owner|SHA256"
          grep -q "minSdkVersion = 24" android/variables.gradle || { echo "::error::minSdk is not 24"; exit 1; }
          ls -la "$aab"

      - name: Upload the signed bundle
        uses: actions/upload-artifact@v7
        with:
          name: duitful-aab
          retention-days: 30
          if-no-files-found: error
          path: android/app/build/outputs/bundle/release/app-release.aab

      # Play Console → the release → "Upload deobfuscation file". Without it,
      # crash stack traces from the R8-minified app are unreadable.
      - name: Upload the R8 mapping file
        uses: actions/upload-artifact@v7
        with:
          name: duitful-aab-mapping
          retention-days: 30
          if-no-files-found: warn
          path: android/app/build/outputs/mapping/release/mapping.txt

      # Google Play. An automatic release or a tag publishes to Production
      # at 100%; a manual run uses
      # the play_track input ("none" skips). The service-account key exists
      # only on this runner and is removed with the keystore below. Without
      # the secret the step warns and skips, so the .aab artifact above still
      # comes out of the run.
      - name: Publish to Google Play
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ github.event_name != 'workflow_dispatch' && 'production' || inputs.play_track }}
        run: |
          if [ "$TRACK" = "none" ]; then echo "Play upload not requested."; exit 0; fi
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is not set, so nothing was sent to Google Play. Upload the duitful-aab artifact by hand, or add the secret (ANDROID_BUILD.md, 'Publishing to Google Play')."
            exit 0
          fi
          umask 077
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-key.json"
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$RUNNER_TEMP/play-key.json" \
            || { echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not valid JSON."; exit 1; }
          node scripts/play-release-notes.mjs "${{ needs.prepare.outputs.version }}" "$DUITFUL_VERSION_CODE" "$RUNNER_TEMP/play-metadata"
          echo "track=$TRACK" >> "$GITHUB_OUTPUT"
          echo "ready=1" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@v1
        if: steps.play.outputs.ready == '1'
        with:
          ruby-version: "3.3"

      - name: Upload the bundle to Google Play
        if: steps.play.outputs.ready == '1'
        env:
          BUNDLE_GEMFILE: fastlane/Gemfile
          TRACK: ${{ steps.play.outputs.track }}
        run: |
          bundle install --jobs 4 --retry 3
          mapping=android/app/build/outputs/mapping/release/mapping.txt
          extra=""
          [ -f "$mapping" ] && extra="mapping:$mapping"
          bundle exec fastlane run upload_to_play_store \
            package_name:com.aydiljoe.duitful \
            json_key:"$RUNNER_TEMP/play-key.json" \
            aab:android/app/build/outputs/bundle/release/app-release.aab \
            $extra \
            track:"$TRACK" \
            release_status:completed \
            metadata_path:"$RUNNER_TEMP/play-metadata" \
            skip_upload_metadata:true \
            skip_upload_images:true \
            skip_upload_screenshots:true
          echo "Published versionCode $DUITFUL_VERSION_CODE to the $TRACK track." >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the keystore and the Play key
        if: always()
        run: rm -f "$RUNNER_TEMP/duitful-upload.keystore" "$RUNNER_TEMP/play-key.json"

  ios:
    needs: prepare
    if: ${{ needs.prepare.outputs.release == 'true' && (github.event_name != 'workflow_dispatch' || inputs.ios) }}
    uses: ./.github/workflows/ios.yml
    with:
      # Automatic releases go to TestFlight; a pushed tag only builds; by
      # hand, only when ticked.
      lane: ${{ ((github.event_name == 'workflow_dispatch' && inputs.testflight) || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref_type == 'branch')) && 'testflight' || 'signed-ipa' }}
    secrets: inherit

  # After an automatic release, mark the commit v<version>. A tag pushed with
  # GITHUB_TOKEN does not start another run, so this cannot release twice.
  tag:
    needs: [prepare, android, ios]
    if: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref_type == 'branch')) && needs.prepare.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag the release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
          echo "Tagged $GITHUB_SHA as v$VERSION." >> "$GITHUB_STEP_SUMMARY"
