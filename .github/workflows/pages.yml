name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Self-host Tesseract under /app/
        run: |
          node scripts/fetch-tesseract.mjs
          mkdir -p app/vendor
          # Copy the CONTENTS, not the directory: app/vendor/ now exists in
          # the checkout (it holds the tracked QR libraries), and `cp -R
          # vendor app/` would nest it as app/vendor/vendor/tesseract.
          cp -R vendor/. app/vendor/
      # Android App Links live or die on this file being reachable at
      # https://duitful.app/.well-known/assetlinks.json. upload-pages-artifact
      # tars the whole tree including dotfiles, so it ships as-is — this guard
      # just makes an accidental deletion fail loudly instead of silently
      # sending every split link back to the browser.
      - name: Check App Links file is present
        run: test -s .well-known/assetlinks.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
