name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Two jobs, as in GitHub's own Pages starter: build uploads the site,
# deploy runs after it. In one job, deploy-pages asked for the artifact
# ~0.3 s after upload-artifact finalized it and sometimes got "Found 0
# artifact(s)" (22 and 24 Nov 2026), failing the deploy while the site
# kept serving the previous version.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Self-host Tesseract under /app/
        run: |
          node scripts/fetch-tesseract.mjs
          mkdir -p app/vendor
          # Copy the CONTENTS, not the directory: app/vendor/ now exists in
          # the checkout (it holds the tracked QR libraries), and `cp -R
          # vendor app/` would nest it as app/vendor/vendor/tesseract.
          cp -R vendor/. app/vendor/
      # Android App Links live or die on this file being reachable at
      # https://duitful.app/.well-known/assetlinks.json, and iOS Universal
      # Links on apple-app-site-association next to it (extensionless, per
      # Apple's spec). upload-pages-artifact tars the whole tree including
      # dotfiles, so they ship as-is — this guard just makes an accidental
      # deletion fail loudly instead of silently sending every split link
      # back to the browser.
      - name: Check App Links files are present
        run: |
          test -s .well-known/assetlinks.json
          test -s .well-known/apple-app-site-association
          python3 -c "import json;json.load(open('.well-known/apple-app-site-association'))"
      # Agent tooling (Claude Code skills) lives in the repo but is not part
      # of the site; the whole-tree upload below would otherwise publish it.
      - name: Drop agent tooling from the site
        run: rm -rf .claude .impeccable PRODUCT.md
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
