<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg03" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e3d6bf"/>
    </linearGradient>
    <linearGradient id="lock03" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d98866"/>
      <stop offset="1" stop-color="#b35a39"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg03)"/>

  <!-- Eyebrow -->
  <text x="100" y="160" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="24" letter-spacing="5" fill="#6b5e52" font-weight="500">
    PRIVACY · BUILT-IN, NOT BOLTED-ON
  </text>

  <!-- Lock visual centred -->
  <g transform="translate(540, 420)">
    <!-- Soft shadow ring -->
    <circle r="200" fill="#fffaf2" opacity="0.6"/>
    <circle r="160" fill="none" stroke="#b35a39" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 8"/>
    <!-- Lock body -->
    <g transform="translate(-90, -100)">
      <rect x="0" y="60" width="180" height="140" rx="22" fill="url(#lock03)"/>
      <path d="M30 60 V40 a60 60 0 01120 0 V60" stroke="url(#lock03)" stroke-width="22" fill="none" stroke-linecap="round"/>
      <circle cx="90" cy="125" r="14" fill="#fffaf2"/>
      <rect x="84" y="135" width="12" height="32" rx="4" fill="#fffaf2"/>
    </g>
  </g>

  <!-- Headline -->
  <text x="540" y="740" text-anchor="middle" font-family="'Fraunces', 'Georgia', serif" font-size="86" font-weight="500" fill="#2a2420">Your data</text>
  <text x="540" y="830" text-anchor="middle" font-family="'Fraunces', 'Georgia', serif" font-size="86" font-weight="500" fill="#2a2420">never leaves</text>
  <text x="540" y="920" text-anchor="middle" font-family="'Fraunces', 'Georgia', serif" font-size="86" font-weight="500" fill="#b35a39" font-style="italic">your phone.</text>

  <!-- Bullet rows -->
  <g transform="translate(140, 1010)" font-family="'Inter', system-ui, sans-serif" font-size="26" fill="#2a2420">
    <g transform="translate(0,0)">
      <circle cx="14" cy="14" r="14" fill="#8fa078"/>
      <path d="M7 14 l5 5 l10 -10" stroke="#fffaf2" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="22">AES-GCM encrypted with your passphrase</text>
    </g>
    <g transform="translate(0,52)">
      <circle cx="14" cy="14" r="14" fill="#8fa078"/>
      <path d="M7 14 l5 5 l10 -10" stroke="#fffaf2" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="22">No account · No email · No tracking SDK</text>
    </g>
    <g transform="translate(0,104)">
      <circle cx="14" cy="14" r="14" fill="#8fa078"/>
      <path d="M7 14 l5 5 l10 -10" stroke="#fffaf2" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="22">We literally cannot read your data</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="100" y="1310" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="28" fill="#b35a39" font-weight="600" letter-spacing="2">
    duitful.app
  </text>
</svg>
