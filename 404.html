<style>
  :root {
    color-scheme: light only;
    --stage: #e9e1d3;
    --card: #f9f5ed;
    --ink: #241f1a;
    --ink2: #6b6157;
    --muted: #8d8376;
    --primary: #1c2b38;
    --brand: #c8704b;
    --border: rgba(42, 36, 32, 0.14);
    --shadow: 0 1px 2px rgba(42, 36, 32, 0.04), 0 8px 24px rgba(42, 36, 32, 0.05);
    --font-serif: "Fraunces", Georgia, "Times New Roman", serif;
    --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--stage);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  main {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 40px 32px;
    max-width: 560px;
    width: 100%;
  }
  .mark {
    font-family: var(--font-serif);
    font-size: 20px;
    color: var(--brand);
    font-style: italic;
    margin: 0 0 24px;
    display: inline-block;
    text-decoration: none;
  }
  h1 {
    font-family: var(--font-serif);
    font-size: clamp(28px, 6vw, 38px);
    line-height: 1.15;
    margin: 0 0 12px;
    font-weight: 600;
  }
  p { margin: 0 0 24px; color: var(--ink2); }
  /* These read as a table unless they carry an affordance a touch device can
     see. :hover does not exist on a phone, so the tappability has to be in
     the resting state: interactive ink, a divider per row, and a chevron. */
  ul { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--border); }
  li + li { border-top: 1px solid var(--border); }
  li a {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 2px 12px;
    padding: 14px 14px 14px 0;
    margin: 0 -14px 0 0;
    color: var(--primary);
    text-decoration: none;
    font-weight: 600;
    -webkit-tap-highlight-color: rgba(28, 43, 56, 0.08);
  }
  li a .note {
    grid-column: 1;
    color: var(--ink2);
    font-weight: 400;
    font-size: 14px;
  }
  li a .chev {
    grid-column: 2;
    grid-row: 1 / span 2;
    color: var(--muted);
    flex: none;
    transition: transform 0.15s ease;
  }
  li a:hover, li a:focus-visible { color: #101c27; }
  li a:hover .chev { transform: translateX(2px); }
  li a:active { opacity: 0.6; }
  .cta {
    display: inline-block;
    margin-top: 28px;
    padding: 12px 22px;
    border-radius: 999px;
    background: var(--primary);
    color: #f9f5ed;
    text-decoration: none;
    font-weight: 600;
  }
  .cta:hover, .cta:focus-visible { background: #101c27; }
  a:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
</style>
